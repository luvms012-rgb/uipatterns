<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Patterns</title>
<link rel="icon" type="image/png" href="https://imagesisa.ybmnet.co.kr/platform/exam_ybmnet_co_kr/common/favicon.png">
<link rel="icon" type="image/x-icon" href="https://imagesisa.ybmnet.co.kr/platform/exam_ybmnet_co_kr/common/favicon.ico">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0c0c0e;
    --bg-nav:    #101013;
    --bg-side:   #101013;
    --bg-card:   #17181c;
    --bg-hover:  #1c1d22;
    --bg-input:  #1a1b1f;
    --border:    #32343e;
    --text-1:    #f0f0f2;
    --text-2:    #9b9da8;
    --text-3:    #6b6d7e;
    --accent:    #3182f6;
    --acc-h:     #2272eb;
    --sidebar-w: 256px;
    --header-h:  80px;
  }
  html, body { height: 100%; font-family: 'Pretendard', -apple-system, sans-serif; font-size: 16px; background: var(--bg); color: var(--text-1); }
  svg, i[data-lucide] { display: block; flex-shrink: 0; }
  i[data-lucide] { display: flex; align-items: center; justify-content: center; }

  /* Header */
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h); background: var(--bg-nav);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 24px; padding: 0 16px;
  }
  .logo { font-size: 28px; font-weight: 700; color: var(--text-1); flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
  .logo-by { font-size: 16px; font-weight: 400; color: #D97757; display: flex; align-items: center; gap: 6px; margin-top: 5px; opacity: 0; transform: translateX(14px); animation: logoByIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards; }
  @keyframes logoByIn {
    0% { opacity: 0; transform: translateX(14px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-by { animation: none; opacity: 1; transform: none; }
  }
  .hdr-right { display: flex; align-items: center; gap: 8px; }
  .hdr-search-wrap { position: relative; display: flex; align-items: center; }
  .hdr-search-icon { position: absolute; left: 12px; display: flex; align-items: center; color: var(--text-3); pointer-events: none; }
  .hdr-search {
    width: 220px; background: #2c2e38; border: none;
    border-radius: 999px; padding: 0 16px 0 36px; height: 36px;
    color: var(--text-1); font-size: 14px; outline: none; transition: background .15s, width .2s;
    font-family: inherit;
  }
  .hdr-search::placeholder { color: var(--text-3); }
  .hdr-search:focus { background: #363844; width: 280px; }

  /* 검색 드롭다운 */
  .search-drop {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    width: 360px; background: #1a1b20; border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 400;
  }
  .search-drop.open { display: block; }
  .sd-section { padding: 12px 0 4px; }
  .sd-section + .sd-section { border-top: 1px solid #2a2b32; }
  .sd-label {
    padding: 0 16px 6px; font-size: 11px; font-weight: 600;
    color: var(--text-3); letter-spacing: .06em; text-transform: uppercase;
  }
  .sd-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; cursor: pointer; transition: background .1s;
  }
  .sd-row:hover { background: var(--bg-hover); }
  .sd-icon {
    width: 32px; height: 32px; border-radius: 8px; background: #2c2e38;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--text-2);
  }
  .sd-body { flex: 1; min-width: 0; }
  .sd-title { font-size: 13px; font-weight: 600; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sd-title mark { background: transparent; color: var(--accent); font-weight: 700; }
  .sd-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .sd-cnt {
    font-size: 12px; color: var(--text-3); flex-shrink: 0;
    background: #2c2e38; padding: 2px 8px; border-radius: 999px;
  }
  .sd-empty { padding: 20px 16px; font-size: 13px; color: var(--text-3); text-align: center; }
  .sd-badge {
    font-size: 10px; font-weight: 700; color: var(--accent); flex-shrink: 0;
    background: rgba(49,130,246,.14); border: 1px solid rgba(49,130,246,.32);
    padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  }

  /* 탭 네비게이션 (헤더 우측 배치, 하단 정렬) */
  .hdr-tabs { display: flex; align-items: center; gap: 0; margin-left: auto; }
  .hdr-tab {
    padding: 0 8px; font-size: 14px; font-weight: 600;
    color: var(--text-3); cursor: pointer; transition: color .15s; border: none;
    background: transparent; font-family: inherit; line-height: normal;
  }
  .hdr-tab:hover { color: var(--text-2); }
  .hdr-tab.active { color: var(--text-1); }
  .hdr-divider { width: 1px; height: 14px; background: var(--border); margin: 0 4px; flex-shrink: 0; align-self: center; }

  /* Layout */
  #app { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg-side); border-right: 1px solid var(--border);
    position: fixed; top: var(--header-h); bottom: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #cat-rows { padding: 8px 8px 20px; }
  .sb-section-label {
    padding: 14px 8px 6px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-1);
  }
  .sb-divider { height: 1px; background: var(--border); margin: 32px 8px 24px; }
  .cat-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; margin: 0 -2px; border-radius: 6px; cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .cat-row:hover { background: #2a2b33; }
  .cb-box {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #484a5a;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .12s; background: transparent;
  }
  .cat-row.on .cb-box { background: var(--accent); border-color: var(--accent); }
  .cat-label { flex: 1; font-size: 14px; color: var(--text-1); }
  .cat-cnt   { font-size: 14px; color: var(--text-3); }

  /* Main */
  #main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; padding: 0 24px 24px; }
  #toolbar { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; margin-bottom: 24px; }
  .tb-title { font-size: 22px; font-weight: 700; color: var(--text-1); }
  .tb-sub   { font-size: 15px; color: var(--text-3); }


  /* Chips */
  #chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  #chips-row:empty { margin-bottom: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #e8e9ed; border: none;
    border-radius: 999px; padding: 0 10px 0 16px; height: 36px; font-size: 14px; font-weight: 600; color: #1a1b1f;
  }
  .chip-x {
    width: 16px; height: 16px; border-radius: 50%; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .12s; color: #5a5c6e;
  }
  .chip-x:hover { background: rgba(0,0,0,.12); color: #1a1b1f; }
  .chip-reset {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 14px; height: 36px; font-size: 14px; font-weight: 600;
    color: var(--text-2); cursor: pointer; transition: background .12s, border-color .12s, color .12s;
    font-family: inherit;
  }
  .chip-reset:hover { background: var(--bg-hover); border-color: var(--border); color: var(--text-1); }

  /* Service group header */
  #grid.filter-mode { display: block; }
  .svc-group { margin-top: 48px; }
  .svc-group.first { margin-top: 0; }
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    column-gap: 32px;
    row-gap: 56px;
    margin-top: 24px;
  }
  .svc-header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .svc-h-icon {
    width: 40px; height: 40px; border-radius: 10px;
    object-fit: cover; flex-shrink: 0;
    background: var(--bg-hover);
  }
  .svc-h-icon[data-missing] { display: none; }
  .svc-h-info { display: flex; flex-direction: column; gap: 2px; }
  .svc-h-name { font-size: 18px; font-weight: 700; color: var(--text-1); }
  .svc-h-cat  { font-size: 12px; color: var(--text-3); }

  /* Grid */
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); column-gap: 32px; row-gap: 56px; }
  .card {
    background: var(--bg-card); border-radius: 20px; overflow: hidden;
    cursor: pointer; transition: transform .18s, box-shadow .18s;
    min-width: 0;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  /* 화면 밖 카드는 레이아웃·페인트·이미지 디코드를 통째로 건너뛴다.
     (4,263장 필터뷰 레이아웃 4,027ms → 250ms / 1,047장 상세뷰 382ms → 48ms — 서버 실측 2026-08-06)
     --cih 는 render() 에서 현재 그리드 폭 기준 카드 높이로 갱신된다. */
  .card { content-visibility: auto; contain-intrinsic-size: auto var(--cih, 642px); }
  .card-img-wrap { position: relative; aspect-ratio: 375/812; background: var(--bg-hover); overflow: hidden; }
  .card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s, opacity .2s; opacity: 0; }
  .card-img.loaded { opacity: 1; }
  .card:hover .card-img { transform: scale(1.02); }
  /* 푸시알림: 가로 배너를 세로 카드 상단에 표시 */
  .card-img-wrap.push-notif { background: #111216; }
  .card-img-wrap.push-notif .card-img { object-fit: contain; object-position: top; }
  .card:hover .card-img-wrap.push-notif .card-img { transform: none; }
  .card-ov {
    position: absolute; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .18s;
  }
  .card:hover .card-ov { opacity: 1; }
  .ov-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.18); color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .card:hover .ov-icon { background: var(--accent); }

  /* Service Index Item — 썸네일/타이틀 분리형 */
  .svc-item { cursor: pointer; min-width: 0; }
  /* 인덱스 카드도 동일 처리 (523장 레이아웃 102ms → 20ms). 썸네일 + 하단 정보바(62px) */
  .svc-item { content-visibility: auto; contain-intrinsic-size: auto calc(var(--cih, 642px) + 62px); }
  .svc-thumb {
    position: relative; aspect-ratio: 375/812; overflow: hidden;
    border-radius: 20px; background: var(--bg-card);
    transition: transform .18s, box-shadow .18s;
  }
  .svc-item:hover .svc-thumb { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .svc-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s, opacity .2s; opacity: 0; }
  .svc-thumb-img.loaded { opacity: 1; }
  .svc-item:hover .svc-thumb-img { transform: scale(1.02); }
  /* 푸시알림 인덱스 썸네일 */
  .svc-thumb.push-notif { background: #111216; }
  .svc-thumb.push-notif .svc-thumb-img { object-fit: contain; object-position: top; }
  .svc-item:hover .svc-thumb.push-notif .svc-thumb-img { transform: none; }
  .svc-thumb-ov {
    position: absolute; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .18s;
  }
  .svc-item:hover .svc-thumb-ov { opacity: 1; }
  .svc-item:hover .ov-icon { background: var(--accent); }
  .svc-info { display: flex; align-items: center; gap: 10px; padding: 14px 4px 0; }
  .svc-info-icon {
    width: 48px; height: 48px; border-radius: 12px;
    object-fit: cover; flex-shrink: 0; background: var(--bg-hover);
  }
  .svc-info-icon[data-missing] { display: none; }
  .svc-info-text { flex: 1; min-width: 0; }
  .svc-info-name { font-size: 18px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .svc-info-cat  { font-size: 13px; color: var(--text-3); margin-top: 4px; }

  /* Service Index Cards */
  .svc-card {
    background: var(--bg-card); border-radius: 20px; overflow: hidden;
    cursor: pointer; transition: transform .18s, box-shadow .18s;
    min-width: 0;
  }
  .svc-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .svc-card-img-wrap { position: relative; aspect-ratio: 375/812; background: var(--bg-hover); overflow: hidden; }
  .svc-card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s, opacity .2s; opacity: 0; }
  .svc-card-img.loaded { opacity: 1; }
  .svc-card:hover .svc-card-img { transform: scale(1.02); }
  .svc-card-ov {
    position: absolute; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .18s;
  }
  .svc-card:hover .svc-card-ov { opacity: 1; }
  .svc-card-footer { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .svc-footer-icon {
    width: 32px; height: 32px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0; background: var(--bg-hover);
  }
  .svc-footer-icon[data-missing] { display: none; }
  .svc-footer-info { flex: 1; min-width: 0; }
  .svc-footer-name { font-size: 13px; font-weight: 700; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .svc-footer-cat { font-size: 11px; color: var(--text-3); margin-top: 1px; }

  /* Detail view */
  #detail-header { display: none; }
  .detail-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0 20px; border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    position: sticky; top: var(--header-h); z-index: 90;
    background: var(--bg);
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .12s, color .12s; font-family: inherit; flex-shrink: 0;
  }
  .back-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .back-btn svg { flex-shrink: 0; }

  /* Empty */
  .empty { text-align: center; padding: 100px 20px; color: var(--text-3); grid-column: 1/-1; }
  .empty svg { margin: 0 auto 16px; opacity: .3; }
  .empty p { font-size: 15px; }
  .empty-sub { margin-top: 8px; font-size: 13px; opacity: .6; }

  /* Lightbox */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.88); align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  #lightbox.open { display: flex; }
  .lb-close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s, color .12s;
  }
  .lb-close:hover { background: var(--bg-hover); color: var(--text-1); }
  .lb-img-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 201;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .12s, opacity .12s, color .12s, border-color .12s;
  }
  .lb-nav:hover { background: var(--bg-hover); color: var(--text-1); }
  .lb-nav:disabled { opacity: .25; cursor: default; pointer-events: none; }
  .lb-prev { left: -56px; }
  .lb-next { right: -56px; }
  @media (max-width: 768px) {
    .lb-nav { width: 34px; height: 34px; }
    .lb-prev { left: -44px; }
    .lb-next { right: -44px; }
  }
  @media (max-width: 480px) {
    /* 화면 폭이 좁으면 이미지 옆 여백이 부족해 화살표를 숨김 (키보드 ←/→ 로 대체) */
    .lb-nav { display: none !important; }
  }
  #lb-img { display: block; max-height: 80vh; max-width: 420px; width: auto; height: auto; border-radius: 12px; }
  .lb-info { display: flex; align-items: center; gap: 12px; }
  .lb-name { color: var(--text-1); font-size: 14px; font-weight: 600; }
  #lb-cat  { color: var(--text-3); font-size: 13px; }
  .lb-dl {
    display: flex; align-items: center; gap: 6px; padding: 8px 16px;
    background: var(--accent); color: #fff; border-radius: 8px;
    font-size: 14px; font-weight: 600; text-decoration: none; transition: background .12s;
    border: none; cursor: pointer; font-family: inherit;
  }
  .lb-dl:hover { background: var(--acc-h); }

  /* Toast */
  #toast {
    position: fixed; top: calc(var(--header-h) + 16px); left: 50%; transform: translateX(-50%) translateY(-12px);
    background: #1e2130; color: var(--text-1); font-size: 14px; font-weight: 500;
    padding: 12px 20px; border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap; z-index: 300;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ═══ RESPONSIVE ═══ */

  /* 사이드바 오버레이 (모바일) */
  #sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.65); z-index: 94;
    backdrop-filter: blur(2px);
  }
  #sidebar-overlay.show { display: block; }

  /* 햄버거 버튼 */
  .hdr-menu-btn {
    display: none; width: 36px; height: 36px; border-radius: 10px;
    background: transparent; border: none; cursor: pointer;
    align-items: center; justify-content: center;
    color: var(--text-2); transition: background .15s, color .15s;
    flex-shrink: 0;
  }
  .hdr-menu-btn:hover { background: var(--bg-hover); color: var(--text-1); }

  /* 사이드바 내 탭 메뉴 (모바일 전용) */
  .sb-mobile-tabs {
    display: none;
    flex-direction: column; gap: 2px;
    padding: 8px 8px 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .sb-mobile-tab {
    display: flex; align-items: center;
    padding: 10px 10px; border-radius: 8px;
    font-size: 15px; font-weight: 600; color: var(--text-3);
    background: transparent; border: none; cursor: pointer;
    font-family: inherit; text-align: left;
    transition: background .12s, color .12s;
  }
  .sb-mobile-tab:hover { background: var(--bg-hover); color: var(--text-1); }
  .sb-mobile-tab.active { color: var(--text-1); }
  @media (max-width: 768px) { .sb-mobile-tabs { display: flex; } }

  .sb-mobile-tabs-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 10px 10px;
  }
  .sb-mobile-tabs-title { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .sb-mobile-close {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--bg-hover); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2); transition: background .12s;
  }
  .sb-mobile-close:hover { background: var(--border); color: var(--text-1); }

  /* 다중 선택 모드 */
  .select-mode-btn {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-2); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .12s, color .12s; font-family: inherit;
  }
  .select-mode-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .select-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* 카드 호버 시 상단 그라디언트 스크림 */
  .card-img-wrap::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 72px;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, transparent 100%);
    opacity: 0; transition: opacity .18s;
    z-index: 8; pointer-events: none;
  }
  .card:hover .card-img-wrap::before,
  .card.selected .card-img-wrap::before { opacity: 1; }

  /* 체크박스 */
  .sel-chk {
    display: none;
    position: absolute; top: 10px; left: 10px;
    width: 28px; height: 28px; border-radius: 6px;
    border: 2.5px solid rgba(255,255,255,.9);
    background: #fff;
    align-items: center; justify-content: center;
    transition: background .12s, border-color .12s;
    z-index: 10; flex-shrink: 0; cursor: pointer;
  }
  .card:hover .sel-chk { display: flex; }
  .card.selected .sel-chk {
    display: flex;
    background: var(--accent); border-color: var(--accent);
  }
  .card.selected .card-img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    border: 3px solid var(--accent);
    border-radius: 20px;
    pointer-events: none;
  }

  /* 선택 바 */
  #select-bar {
    display: flex;
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(calc(100% + 32px));
    opacity: 0; pointer-events: none;
    transition: transform .3s cubic-bezier(.34,1.4,.64,1), opacity .2s ease;
    background: #1e2130; border: 1px solid var(--border);
    border-radius: 16px; padding: 10px 12px 10px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
    align-items: center; gap: 10px; z-index: 150;
    white-space: nowrap;
  }
  #select-bar.open { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
  .sb-count { font-size: 14px; font-weight: 600; color: var(--text-1); flex: 1; }
  .sb-count-num { color: var(--accent); }
  .sb-sel-all-btn {
    font-size: 13px; font-weight: 500; color: var(--text-2); cursor: pointer;
    padding: 6px 10px; border-radius: 6px; transition: background .12s, color .12s;
    background: transparent; border: none; font-family: inherit;
  }
  .sb-sel-all-btn:hover { background: var(--bg-hover); color: var(--text-1); }
  .sb-dl-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; background: var(--accent); color: #fff;
    border-radius: 8px; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: background .12s; border: none; font-family: inherit;
  }
  .sb-dl-btn:hover:not(:disabled) { background: var(--acc-h); }
  .sb-dl-btn:disabled { background: #444; cursor: not-allowed; opacity: .6; }
  .sb-exit-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s; flex-shrink: 0;
  }
  .sb-exit-btn:hover { background: var(--bg-hover); color: var(--text-1); }

  /* ═══ ADMIN DASHBOARD ═══ */
  #admin-btn {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: transparent; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); transition: background .15s, color .15s;
  }
  #admin-btn:hover { background: var(--bg-hover); color: var(--text-1); }

  #dashboard {
    position: fixed; inset: 0; background: var(--bg); z-index: 500;
    overflow-y: auto; opacity: 0; pointer-events: none;
    transform: translateY(20px);
    transition: opacity .3s ease, transform .3s ease;
  }
  #dashboard.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

  .dash-hdr {
    position: sticky; top: 0; height: 64px;
    background: var(--bg-nav); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; z-index: 10;
  }
  .dash-hdr-title { font-size: 20px; font-weight: 700; color: var(--text-1); }
  .dash-hdr-close {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .dash-hdr-close:hover { background: var(--bg-hover); color: var(--text-1); }

  .dash-body { max-width: 960px; margin: 0 auto; padding: 48px 40px 80px; }

  .dash-hero { margin-bottom: 40px; }
  .dash-hero-big { font-size: 36px; font-weight: 700; color: var(--text-1); margin-bottom: 6px; line-height: 1.2; }
  .dash-hero-big em { color: var(--accent); font-style: normal; }
  .dash-hero-sub { font-size: 18px; color: var(--text-2); }

  .dash-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 40px; }
  .dash-card { background: var(--bg-card); border-radius: 20px; padding: 34px 32px; }
  .dash-card-label { font-size: 15px; color: var(--text-2); margin-bottom: 14px; font-weight: 500; }
  .dash-card-num { font-size: 38px; font-weight: 700; color: var(--text-1); line-height: 1; }
  .dash-card-unit { font-size: 18px; font-weight: 500; color: var(--text-3); margin-left: 3px; }
  .dash-card-sub { font-size: 14px; color: var(--text-3); margin-top: 8px; }

  .dash-section { margin-bottom: 40px; }
  .dash-section-title { font-size: 19px; font-weight: 700; color: var(--text-1); margin-bottom: 16px; }

  .dash-week-card { background: var(--bg-card); border-radius: 20px; padding: 36px 36px 40px; }
  .dash-week-headline { font-size: 24px; font-weight: 700; color: var(--text-1); margin-bottom: 4px; }
  .dash-week-sub { font-size: 15px; color: var(--text-2); margin-bottom: 32px; }
  .dash-bars {
    display: flex; align-items: flex-end; gap: 8px;
    height: 150px; padding-bottom: 28px; position: relative;
  }
  .dash-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; height: 100%; justify-content: flex-end; }
  .dash-bar-val { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; min-height: 15px; text-align: center; }
  .dash-bar-rect { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; }
  .dash-bar-rect.active { background: var(--accent); }
  .dash-bar-rect.past { background: #252737; }
  .dash-bar-date { position: absolute; bottom: -22px; font-size: 13px; color: var(--text-3); white-space: nowrap; }

  .dash-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 40px; }

  .dash-hbar-card, .dash-rank-card { background: var(--bg-card); border-radius: 20px; padding: 34px 32px; }
  .dash-hbar-list { display: flex; flex-direction: column; gap: 16px; }
  .dash-hbar-top { display: flex; justify-content: space-between; margin-bottom: 7px; }
  .dash-hbar-name { font-size: 15px; font-weight: 600; color: var(--text-1); }
  .dash-hbar-cnt { font-size: 14px; color: var(--text-2); }
  .dash-hbar-track { height: 7px; border-radius: 4px; background: var(--bg-hover); overflow: hidden; }
  .dash-hbar-fill { height: 100%; border-radius: 4px; background: var(--accent); }

  .dash-rank-list { display: flex; flex-direction: column; }
  .dash-rank-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .dash-rank-row:last-child { border-bottom: none; }
  .dash-rank-num { font-size: 15px; font-weight: 700; color: var(--accent); width: 20px; flex-shrink: 0; }
  .dash-rank-icon { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; background: var(--bg-hover); flex-shrink: 0; }
  .dash-rank-name { font-size: 15px; font-weight: 600; color: var(--text-1); flex: 1; }
  .dash-rank-cnt { font-size: 14px; color: var(--text-2); }

  .dash-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .dash-tag {
    padding: 6px 14px; border-radius: 999px;
    background: var(--bg-card); border: 1px solid var(--border);
    font-size: 13px; color: var(--text-2);
  }
  .dash-empty-msg { font-size: 15px; color: var(--text-3); padding: 8px 0; line-height: 1.8; }

  /* Cost savings */
  .dash-cost-card {
    background: linear-gradient(135deg, #0f1729 0%, #131a2e 100%);
    border: 1px solid #1e2d50; border-radius: 20px;
    padding: 40px 36px; margin-bottom: 40px;
    position: relative; overflow: hidden;
  }
  .dash-cost-card::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(49,130,246,.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .dash-cost-eyebrow {
    font-size: 12px; font-weight: 600; color: var(--accent);
    letter-spacing: .06em; text-transform: uppercase; margin-bottom: 10px;
  }
  .dash-cost-headline {
    font-size: 28px; font-weight: 700; color: var(--text-1); margin-bottom: 6px; line-height: 1.2;
  }
  .dash-cost-headline em { color: var(--accent); font-style: normal; }
  .dash-cost-sub { font-size: 16px; color: var(--text-2); margin-bottom: 32px; }

  /* 절감 2열 stat */
  .dash-cost-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
  .dash-cost-stat {
    background: rgba(255,255,255,.04); border: 1px solid #1e2d50;
    border-radius: 14px; padding: 18px 18px 14px;
  }
  .dash-cost-stat-label { font-size: 13px; color: var(--text-3); margin-bottom: 8px; font-weight: 600; letter-spacing:.04em; text-transform:uppercase; }
  .dash-cost-stat-val { font-size: 26px; font-weight: 700; color: var(--text-1); line-height: 1.15; }
  .dash-cost-stat-val.accent { color: var(--accent); }
  .dash-cost-stat-unit { font-size: 16px; font-weight: 500; margin-left: 2px; }
  .dash-cost-stat-note { font-size: 13px; color: var(--text-3); margin-top: 6px; }

  /* 진행 바 */
  .dash-cost-prog-wrap { margin-top: 20px; }
  .dash-cost-prog-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--text-3); margin-bottom: 8px;
  }
  .dash-cost-prog-track {
    height: 5px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden;
  }
  .dash-cost-prog-fill {
    height: 100%; background: var(--accent); border-radius: 999px;
  }

  /* 비교 행 */
  .dash-cost-divider { height: 1px; background: #1e2d50; }
  .dash-cost-compare { display: flex; flex-direction: column; gap: 10px; }
  .dash-cost-compare-row { display: flex; justify-content: space-between; align-items: center; }
  .dash-cost-compare-label { font-size: 15px; color: var(--text-2); }
  .dash-cost-compare-val { font-size: 15px; font-weight: 600; color: var(--text-1); }
  .dash-cost-compare-note { font-size: 13px; color: var(--text-3); margin-left: 6px; font-weight: 400; }

  /* 사용현황 통합 탭 + 플랫폼 요약 */
  .dash-tabs { display: inline-flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 4px; margin-bottom: 28px; }
  .dash-tab { appearance: none; border: none; background: transparent; color: var(--text-3); font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
  .dash-tab:hover { color: var(--text-1); }
  .dash-tab.active { background: var(--accent); color: #fff; }

  .dash-platform-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; max-width: 460px; }
  .dash-platform-pill { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; transition: border-color .15s, background .15s; cursor: pointer; text-align: left; font-family: inherit; width: 100%; appearance: none; }
  .dash-platform-pill:hover { background: var(--bg-hover); }
  .dash-platform-pill.active { border-color: var(--accent); }
  .dash-platform-pill-label { display: block; font-size: 13px; color: var(--text-3); font-weight: 600; margin-bottom: 4px; }
  .dash-platform-pill-val { display: block; font-size: 20px; color: var(--text-1); font-weight: 700; line-height: 1.3; }
  .dash-platform-pill-sub { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }

  /* ══════════════════════════════════════════
     RESPONSIVE — 모든 기본 스타일 다음에 위치
     ══════════════════════════════════════════ */

  /* ── Tablet Landscape : ≤1100px ── */
  @media (max-width: 1100px) {
    :root { --sidebar-w: 180px; }
    .logo-by { display: none; }
    .hdr-search { width: 180px; }
    .hdr-search:focus { width: 220px; }
    /* 열 수는 변경하지 않음 — 데스크탑은 항상 5열 유지 */
    #grid { column-gap: 20px; row-gap: 44px; }
    .mini-grid { column-gap: 20px; row-gap: 44px; }
    .sb-section-label { font-size: 15px; }
    .cat-label, .cat-cnt { font-size: 13px; }
  }

  /* ── Tablet Portrait : ≤768px ── */
  @media (max-width: 768px) {
    :root { --header-h: 60px; --sidebar-w: 268px; }

    /* 헤더 */
    .hdr-menu-btn { display: flex; }
    .logo { font-size: 22px; }
    .logo-by { display: none; }
    .hdr-tabs { display: none; }
    .hdr-search { width: 150px; }
    .hdr-search:focus { width: 190px; }

    /* 사이드바 슬라이드 */
    #sidebar {
      transform: translateX(-100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      z-index: 95;
      box-shadow: 4px 0 24px rgba(0,0,0,.5);
    }
    #sidebar.open { transform: translateX(0); }

    /* 메인 */
    #main { margin-left: 0; padding: 0 16px 80px; }

    /* 그리드: 3열, gap 축소 */
    #grid { grid-template-columns: repeat(3, 1fr); column-gap: 16px; row-gap: 28px; }
    .mini-grid { grid-template-columns: repeat(3, 1fr); column-gap: 16px; row-gap: 28px; }

    /* 카드 */
    .svc-info-name { font-size: 15px; }
    .tb-title { font-size: 18px; }

    /* 대시보드 */
    .dash-body { max-width: 100%; padding: 24px 16px 60px; }
    .dash-hdr { padding: 0 16px; }
    .dash-hero-big { font-size: 28px; }
    .dash-cost-headline { font-size: 24px; }
    .dash-cards { grid-template-columns: 1fr; gap: 10px; }
    .dash-grid-2 { grid-template-columns: 1fr; }
    .dash-cost-2col { grid-template-columns: 1fr; gap: 10px; }
    .dash-tab { padding: 8px 14px; font-size: 13px; }
    .dash-platform-pills { max-width: 100%; }

    /* 터치 기기: hover 없으므로 체크박스 항상 표시 */
    .sel-chk { display: flex; opacity: 0.5; }
    .card.selected .sel-chk { opacity: 1; }
  }

  /* ── Mobile : ≤480px ── */
  @media (max-width: 480px) {
    :root { --header-h: 56px; }

    .logo { font-size: 18px; }
    #header { gap: 12px; padding: 0 14px; }
    .hdr-search { width: 110px; }
    .hdr-search:focus { width: 150px; }

    #main { padding: 0 12px 80px; }
    #toolbar { padding-top: 16px; margin-bottom: 16px; }

    /* 모바일: 2열 */
    #grid { grid-template-columns: repeat(2, 1fr); column-gap: 12px; row-gap: 20px; }
    .mini-grid { grid-template-columns: repeat(2, 1fr); column-gap: 12px; row-gap: 20px; }

    .svc-info { padding: 10px 2px 0; gap: 8px; }
    .svc-info-name { font-size: 13px; }
    .svc-info-cat  { font-size: 11px; }
    .svc-info-icon { width: 28px; height: 28px; border-radius: 10px; }

    /* 좁은 화면: 뒤로가기 버튼 아이콘만 표시 */
    .back-btn span { display: none; }
    .back-btn { padding: 8px; }
    .detail-bar { gap: 10px; }

    #lb-img { max-height: 72vh; max-width: 92vw; }
    #select-bar { width: calc(100vw - 24px); }

    .dash-body { max-width: 100%; padding: 20px 16px 60px; }
    .dash-hdr { padding: 0 16px; }
    .dash-hero-big { font-size: 24px; line-height: 1.3; }
    .dash-hero-sub { font-size: 16px; }
    .dash-cards { grid-template-columns: 1fr; gap: 10px; }
    .dash-cost-2col { grid-template-columns: 1fr; gap: 10px; }
    .dash-grid-2 { grid-template-columns: 1fr; }
    .dash-cost-headline { font-size: 21px; }
    .dash-cost-card { padding: 32px 26px; }
    .dash-card { padding: 28px 26px; }
    .dash-card-num { font-size: 30px; }
    .dash-week-card { padding: 28px 24px 36px; }
    .dash-week-headline { font-size: 20px; }
    .dash-platform-pills { grid-template-columns: 1fr; }
    .dash-platform-pill-val { font-size: 18px; }
  }

  /* ── Small Mobile : ≤360px ── */
  @media (max-width: 360px) {
    #grid { grid-template-columns: repeat(2, 1fr); column-gap: 8px; }
    .mini-grid { grid-template-columns: repeat(2, 1fr); column-gap: 8px; }
    .hdr-search { width: 90px; }
    .hdr-search:focus { width: 120px; }
  }

</style>

<script>
window.DATA = DATA;

// 영문 우선 → 한글 순 정렬
function sortMixed(a, b) {
  const aKo = /^[ㄱ-ㅎ가-힣]/.test(a);
  const bKo = /^[ㄱ-ㅎ가-힣]/.test(b);
  if (aKo !== bKo) return aKo ? 1 : -1;
  return a.localeCompare(b, aKo ? 'ko' : 'en', { sensitivity: 'base' });
}
const DISPLAY_DATA = DATA.filter(i => i.category !== 'icons');
const DATA_BY_PATH = new Map(DISPLAY_DATA.map(i => [i.path, i]));
const ALL_CATS = [...new Set(DISPLAY_DATA.map(i => i.category))].sort(sortMixed);
const CAT_COUNTS = {};
DISPLAY_DATA.forEach(i => { CAT_COUNTS[i.category] = (CAT_COUNTS[i.category]||0)+1; });

const S = { checked: new Set(), checkedComps: new Set(), checkedTypes: new Set(), selected: new Set(), view: 'index', svc: null };

// SVC_TYPES에 없는 새 서비스는 '미분류'로 자동 분류 (수동 매핑 전까지 사이드바에 자동 노출)
const UNCLASSIFIED = '미분류';
function getSvcType(svcName) { return SVC_TYPES[svcName] || UNCLASSIFIED; }


// 업종별 아이템 수 계산
const TYPE_COUNTS = {};
DISPLAY_DATA.forEach(item => {
  const t = getSvcType(extractService(item.name));
  if (t) TYPE_COUNTS[t] = (TYPE_COUNTS[t]||0) + 1;
});

// ── 이미지 주소 ──────────────────────────────────────────────────────────
// 이미지는 회사 서버(UIP_CONFIG.imgBase)에만 있다. 화면 표시는 원본 주소를 바로 쓰고,
// 다운로드처럼 파일 내용을 읽어야 할 때만 이미지 중계(UIP_CONFIG.imgProxy)를 거친다
// (회사 서버에 CORS 헤더가 없어 github.io에서 직접 fetch하면 브라우저가 막는다).
function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
function imgUrl(p, platform = PLATFORM) { return UIP_CONFIG.imgBase + platform + '/' + encodePath(p); }
function dlUrl(p, platform = PLATFORM) {
  if (!UIP_CONFIG.imgProxy) return imgUrl(p, platform);
  return UIP_CONFIG.imgProxy.replace(/\/$/, '') + '/' + platform + '/' + encodePath(p);
}
function iconBase(platform = PLATFORM) { return UIP_CONFIG.imgBase + platform + '/icons/'; }

async function dlImg(encPath, encName) {
  const path = decodeURIComponent(encPath);
  const name = decodeURIComponent(encName) + '.png';
  aTrack('download', { count: 1 });
  try {
    const res = await fetch(dlUrl(path));
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch {
    // fetch 실패(file:// 등) 시 이미지 뷰어 새창으로 열기 (닫기 버튼 포함)
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${name}</title>
      <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0c0c0e;display:flex;align-items:center;justify-content:center;min-height:100vh}
      img{max-width:calc(100vw - 80px);max-height:calc(100vh - 80px);object-fit:contain;border-radius:8px}
      .close-btn{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;line-height:1}
      .close-btn:hover{background:rgba(255,255,255,.22)}
      .back-btn{position:fixed;top:16px;left:16px;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.12);border:none;cursor:pointer;color:#fff;font-size:13px;font-family:sans-serif}
      .back-btn:hover{background:rgba(255,255,255,.22)}</style></head>
      <body>
      <button class="back-btn" onclick="window.close()">← 돌아가기</button>
      <img src="${imgUrl(path)}" alt="${name}">
      <button class="close-btn" onclick="window.close()">✕</button>
      </body></html>`);
      win.document.close();
    }
  }
}

// 아이콘 확장자 순차 시도 (png → webp → jpg → 숨김)
const ICON_EXTS = ['webp', 'jpg'];
function tryNextIconExt(el) {
  const svc = el.dataset.svc || el.alt;
  const base = el.dataset.iconBase || iconBase();
  const tried = (el.dataset.iconTry | 0);
  if (tried < ICON_EXTS.length) {
    el.dataset.iconTry = tried + 1;
    el.src = base + encodeURIComponent(svc) + '.' + ICON_EXTS[tried];
  } else {
    el.setAttribute('data-missing', '1');
  }
}

function extractService(name) {
  return name.split('_')[0].trim().normalize('NFC');
}
function extractPattern(name) {
  const parts = name.split('_');
  // 구조: 서비스_패턴_번호_날짜 → 패턴명 추출 (없으면 빈 문자열)
  if (parts.length <= 3) return '';
  return parts.slice(1, -2).join(' ');
}

function getItems() {
  return DISPLAY_DATA.filter(item => {
    if (S.checked.size && !S.checked.has(item.category)) return false;
    if (S.checkedComps.size && !(item.comps || []).some(c => S.checkedComps.has(c))) return false;
    if (S.checkedTypes.size) {
      const t = getSvcType(extractService(item.name));
      if (!t || !S.checkedTypes.has(t)) return false;
    }
    return true;
  });
}

// ── 사이드바 ────────────────────────────────────────────────────────────
// 그리기(buildSidebar)·컴포넌트 토글은 ../assets/sidebar.js, 분류 기준은 taxonomy.js

function toggleType(enc) {
  S.selected.clear(); document.getElementById('select-bar').classList.remove('open');
  const t = decodeURIComponent(enc);
  S.checkedTypes.has(t) ? S.checkedTypes.delete(t) : S.checkedTypes.add(t);
  S.view = 'index'; S.svc = null;
  buildSidebar(); render(); syncUrl();
  window.scrollTo({ top: 0, behavior: 'auto' });
  closeSidebarOnMobile();
}

function toggleCat(enc) {
  S.selected.clear(); document.getElementById('select-bar').classList.remove('open');
  const cat = decodeURIComponent(enc);
  if (!S.checked.has(cat)) aTrack('filter_cat', { cat });
  S.checked.has(cat) ? S.checked.delete(cat) : S.checked.add(cat);
  S.view = 'index'; S.svc = null;
  buildSidebar(); render(); syncUrl();
  window.scrollTo({ top: 0, behavior: 'auto' });
  closeSidebarOnMobile();
}

function onSbSearch(v) { render(); }

// ── 검색 드롭다운 ────────────────────────────────────────────────────────
function hl(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

// ── 통합검색: 상대편 사이트 검색 인덱스 (지연 로딩, script 주입 방식) ──────
let crossSearchIndex = null;
let crossSearchPromise = null;
function loadCrossSearchIndex() {
  if (crossSearchPromise) return crossSearchPromise;
  const otherPlatform = PLATFORM === 'mo' ? 'web' : 'mo';
  crossSearchPromise = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = '../' + otherPlatform + '/search-index.js?_=' + Date.now();
    s.onload = () => { crossSearchIndex = window.__SEARCH_INDEX__ || null; s.remove(); resolve(crossSearchIndex); };
    s.onerror = () => { s.remove(); resolve(null); };
    document.head.appendChild(s);
  });
  return crossSearchPromise;
}

function onSearchInput(v) {
  const q = v.trim();
  const drop = document.getElementById('searchDrop');
  if (q.length < 2) { drop.classList.remove('open'); return; }

  // 상대 사이트 인덱스가 아직 없으면 백그라운드로 불러온 뒤, 입력값이 그대로면 재검색
  if (!crossSearchIndex) {
    loadCrossSearchIndex().then(() => {
      const cur = document.getElementById('hdrSearchInput');
      if (cur && cur.value.trim() === q) onSearchInput(q);
    });
  }

  // 카테고리 매칭
  const cats = ALL_CATS.filter(c => c.toLowerCase().includes(q.toLowerCase()));

  // 서비스 매칭 (서비스명 유니크)
  const svcMap = new Map();
  DISPLAY_DATA.forEach(item => {
    const svc = extractService(item.name);
    if (!svc.toLowerCase().includes(q.toLowerCase())) return;
    if (!svcMap.has(svc)) svcMap.set(svc, { cat: item.category, count: 0 });
    svcMap.get(svc).count++;
  });
  const svcs = [...svcMap.entries()].sort((a,b) => sortMixed(a[0],b[0]));

  // 패턴명 매칭 (유니크 패턴명 기준)
  const patMap = new Map();
  DISPLAY_DATA.forEach(item => {
    const pat = extractPattern(item.name);
    if (!pat || !pat.toLowerCase().includes(q.toLowerCase())) return;
    const key = pat + '|' + extractService(item.name);
    if (!patMap.has(key)) patMap.set(key, { pat, svc: extractService(item.name), cat: item.category, item });
  });
  const pats = [...patMap.values()].slice(0, 8);

  // ── 상대 사이트 매칭 (모바일·웹사이트 통합검색) ────────────────────────
  const otherPlatform = PLATFORM === 'mo' ? 'web' : 'mo';
  const otherLabel = otherPlatform === 'mo' ? '모바일' : '웹사이트';
  let crossCats = [], crossSvcs = [], crossPats = [];
  if (crossSearchIndex) {
    crossCats = (crossSearchIndex.cats || []).filter(c => c.toLowerCase().includes(q.toLowerCase())).slice(0, 4);
    crossSvcs = (crossSearchIndex.svcs || []).filter(s => s.svc.toLowerCase().includes(q.toLowerCase())).slice(0, 4);
    crossPats = (crossSearchIndex.pats || []).filter(p => p.pat.toLowerCase().includes(q.toLowerCase())).slice(0, 4);
  }

  const total = cats.length + svcs.length + pats.length + crossCats.length + crossSvcs.length + crossPats.length;
  if (!total) {
    drop.innerHTML = `<div class="sd-empty">검색 결과가 없어요</div>`;
    drop.classList.add('open');
    return;
  }

  const SEARCH_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`;
  const IMG_SVG   = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  const GRID_SVG  = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`;

  let html = '';

  if (cats.length) {
    html += `<div class="sd-section"><div class="sd-label">카테고리</div>`;
    html += cats.map(c => `
      <div class="sd-row" onclick="searchSelectCat('${encodeURIComponent(c)}')">
        <div class="sd-body"><div class="sd-title">${hl(c, q)}</div></div>
        <span class="sd-cnt">${CAT_COUNTS[c]||0}</span>
      </div>`).join('');
    html += `</div>`;
  }

  if (svcs.length) {
    html += `<div class="sd-section"><div class="sd-label">서비스</div>`;
    html += svcs.map(([svc, info]) => `
      <div class="sd-row" onclick="searchSelectSvc('${encodeURIComponent(svc)}')">
        <div class="sd-body">
          <div class="sd-title">${hl(svc, q)}</div>
          <div class="sd-sub">${info.cat} · ${info.count}장</div>
        </div>
      </div>`).join('');
    html += `</div>`;
  }

  if (pats.length) {
    html += `<div class="sd-section"><div class="sd-label">패턴</div>`;
    html += pats.map(({pat, svc, cat, item}) => `
      <div class="sd-row" onclick="searchOpenItem('${encodeURIComponent(item.path)}','${encodeURIComponent(item.name)}','${encodeURIComponent(cat)}')">
        <div class="sd-body">
          <div class="sd-title">${hl(pat, q)}</div>
          <div class="sd-sub">${svc} · ${cat}</div>
        </div>
      </div>`).join('');
    html += `</div>`;
  }

  if (crossCats.length || crossSvcs.length || crossPats.length) {
    html += `<div class="sd-section"><div class="sd-label">${otherLabel}에서</div>`;
    html += crossCats.map(c => `
      <div class="sd-row" onclick="crossSearchSelectCat('${otherPlatform}','${encodeURIComponent(c)}')">
        <div class="sd-body"><div class="sd-title">${hl(c, q)}</div></div>
        <span class="sd-badge">${otherLabel}</span>
      </div>`).join('');
    html += crossSvcs.map(s => `
      <div class="sd-row" onclick="crossSearchSelectSvc('${otherPlatform}','${encodeURIComponent(s.svc)}')">
        <div class="sd-body">
          <div class="sd-title">${hl(s.svc, q)}</div>
          <div class="sd-sub">${s.cat} · ${s.count}장</div>
        </div>
        <span class="sd-badge">${otherLabel}</span>
      </div>`).join('');
    html += crossPats.map(p => `
      <div class="sd-row" onclick="crossSearchOpenItem('${otherPlatform}','${encodeURIComponent(p.path)}','${encodeURIComponent(p.name)}','${encodeURIComponent(p.cat)}')">
        <div class="sd-body">
          <div class="sd-title">${hl(p.pat, q)}</div>
          <div class="sd-sub">${p.svc} · ${p.cat}</div>
        </div>
        <span class="sd-badge">${otherLabel}</span>
      </div>`).join('');
    html += `</div>`;
  }

  drop.innerHTML = html;
  drop.classList.add('open');
}

// ── 다중 선택 ──────────────────────────────────────────────────────────
function exitSelectMode() {
  S.selected.clear();
  document.querySelectorAll('.card.selected').forEach(c => {
    c.classList.remove('selected');
    const chk = c.querySelector('.sel-chk'); if (chk) chk.innerHTML = '';
  });
  document.getElementById('select-bar').classList.remove('open');
}

function toggleSelect(el) {
  const path = el.dataset.path;
  if (S.selected.has(path)) {
    S.selected.delete(path);
    el.classList.remove('selected');
    const chk = el.querySelector('.sel-chk'); if (chk) chk.innerHTML = '';
  } else {
    S.selected.add(path);
    el.classList.add('selected');
    const chk = el.querySelector('.sel-chk'); if (chk) chk.innerHTML = CHK_SVG;
  }
  updateSelectBar();
}

function selectAll() {
  const cards = [...document.querySelectorAll('.card[data-path]')];
  const allSel = cards.length > 0 && cards.every(c => S.selected.has(c.dataset.path));
  if (allSel) {
    cards.forEach(c => {
      S.selected.delete(c.dataset.path);
      c.classList.remove('selected');
      const chk = c.querySelector('.sel-chk'); if (chk) chk.innerHTML = '';
    });
  } else {
    cards.forEach(c => {
      S.selected.add(c.dataset.path);
      c.classList.add('selected');
      const chk = c.querySelector('.sel-chk'); if (chk) chk.innerHTML = CHK_SVG;
    });
  }
  updateSelectBar();
}

function updateSelectBar() {
  const cnt = S.selected.size;
  const numEl = document.getElementById('sb-count-num');
  if (numEl) numEl.textContent = cnt;
  const dlBtn = document.getElementById('sb-dl-btn');
  if (dlBtn) dlBtn.disabled = cnt === 0;
  const bar = document.getElementById('select-bar');
  if (cnt > 0) bar.classList.add('open');
  else bar.classList.remove('open');
  const selAllBtn = document.getElementById('sb-sel-all');
  if (selAllBtn) {
    const cards = [...document.querySelectorAll('.card[data-path]')];

}

// 선택 다운로드 — ZIP으로 묶지 않고 원래 파일명 그대로 저장한다.
//  1) 크롬·엣지: 저장할 폴더를 한 번 고르면 선택한 이미지를 그 폴더에 한꺼번에 저장
//  2) 그 외 브라우저: 한 장씩 순서대로 다운로드 (처음 한 번 '여러 파일 다운로드 허용' 필요)
// 파일 내용을 읽어야 하므로 이미지 중계(UIP_CONFIG.imgProxy)가 있어야 한다. 없거나 실패하면
// 남은 이미지는 예전처럼 새 창으로 연다.
async function dlSelected() {
  const items = DISPLAY_DATA.filter(i => S.selected.has(i.path));
  if (!items.length) return;
  const cnt = items.length;
  const btn = document.getElementById('sb-dl-btn');
  const DL_SVG_SM = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  const fileName = item => item.path.split('/').pop();
  async function getBlob(item) {
    const res = await fetch(dlUrl(item.path));
    if (!res.ok) throw new Error('fetch ' + res.status);
    return res.blob();
  }

  let dir = null;
  if (window.showDirectoryPicker) {
    try { dir = await window.showDirectoryPicker({ id: 'uip-download', mode: 'readwrite' }); }
    catch (e) { if (e.name === 'AbortError') return; dir = null; }  // 폴더 선택 취소 → 아무것도 안 함
  }

  if (btn) btn.disabled = true;
  let i = 0;
  try {
    for (; i < cnt; i++) {
      const item = items[i];
      if (btn) btn.innerHTML = `${DL_SVG_SM} ${i + 1} / ${cnt} 저장 중`;
      const blob = await getBlob(item);
      if (dir) {
        const fh = await dir.getFileHandle(fileName(item), { create: true });
        const w = await fh.createWritable();
        await w.write(blob);
        await w.close();
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fileName(item);
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        if (i < cnt - 1) await new Promise(r => setTimeout(r, 300));
      }
    }
    aTrack('download', { count: cnt });
    showToast(dir ? `${cnt}개를 '${dir.name}' 폴더에 저장했어요` : `${cnt}개 다운로드 완료`);
  } catch {
    // 중계 없음·실패: 남은 이미지는 새 창으로 열기 (dlImg가 개별 집계)
    if (i > 0) aTrack('download', { count: i });
    for (; i < cnt; i++) {
      const item = items[i];
      if (btn) btn.innerHTML = `${DL_SVG_SM} ${i + 1} / ${cnt}`;
      await dlImg(encodeURIComponent(item.path), encodeURIComponent(item.name));
      if (i < cnt - 1) await new Promise(r => setTimeout(r, 300));
    }
    showToast(`${cnt}개 다운로드 완료`);
  }
  if (btn) btn.innerHTML = `${DL_SVG_SM} 다운로드`;
  exitSelectMode();
  updateSelectBar();
}

function cardTpl(item, ec) {

function render() {
  buildChips();
  updateCardIntrinsic();
  const g = document.getElementById('grid');
  const ec = encodeURIComponent;

  if (!DISPLAY_DATA.length) {
    g.classList.remove('filter-mode');
    g.innerHTML = `<div class="empty">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <p>이미지가 없습니다</p>
      <p class="empty-sub">카테고리 폴더에 이미지를 추가한 뒤 update.bat을 실행하세요</p>
    </div>`;
    return;
  }

  // ── 디테일 모드: 선택된 서비스의 전체 스크린 ─────────────────────────────
  if (S.view === 'detail' && S.svc) {
    const svcItems = DISPLAY_DATA.filter(i => extractService(i.name) === S.svc);
    if (!svcItems.length) { backToIndex(); return; }
    const cat = svcItems[0].category;
    const dh = document.getElementById('detail-header');
    dh.style.display = 'block';
    dh.innerHTML = `<div class="detail-bar">
      <button class="back-btn" onclick="backToIndex()" aria-label="목록으로 돌아가기">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        <span>목록</span>
      </button>
      <img class="svc-h-icon" src="${iconBase()}${encodeURIComponent(S.svc)}.png" alt="${S.svc}"
        data-svc="${S.svc.replace(/"/g,'&quot;')}" onerror="tryNextIconExt(this)">
      <div class="svc-h-info">
        <span class="svc-h-name">${S.svc}</span>
        <span class="svc-h-cat">${cat}</span>
      </div>
    </div>`;
    g.classList.remove('filter-mode');
    resetLazyObservers();
    renderChunked(g, svcItems.map(item => cardTpl(item, ec)));
    return;
  }
  document.getElementById('detail-header').style.display = 'none';

  // ── 인덱스 모드: 서비스당 카드 1장 ──────────────────────────────────────
  const items = getItems();
  // svc별 이미지 배열 + 최신 날짜를 한 번의 순회로 함께 계산한다.
  // (예전엔 정렬 비교함수 안에서 매번 배열 전체를 훑어 최신 날짜를 재계산했는데,
  //  이미지가 많은 서비스가 비교될 때마다 반복 재계산되어 O(N log N × 그룹크기)로
  //  폭증했다 — 524개 서비스 정렬에 1.46초까지 걸린 것을 실측으로 확인. 그룹핑 시
  //  1회만 계산해두는 것으로 40ms 미만까지 줄어든다.)
  const groupsRaw = new Map(); // svc -> { items:[], maxDate:'' }
  items.forEach(item => {
    const svc = extractService(item.name);
    let g2 = groupsRaw.get(svc);
    if (!g2) { g2 = { items: [], maxDate: '' }; groupsRaw.set(svc, g2); }
    g2.items.push(item);
    const d = item.name.split('_').pop();
    if (d > g2.maxDate) g2.maxDate = d;
  });
  const sortedEntries = [...groupsRaw.entries()].sort((a, b) => {
    const da = a[1].maxDate, db = b[1].maxDate;
    return da === db ? sortMixed(a[0], b[0]) : (da < db ? 1 : -1);
  });
  const groups = new Map(sortedEntries.map(([svc, g2]) => [svc, g2.items]));

  if (!groups.size) {
    g.classList.remove('filter-mode');
    g.innerHTML = `<div class="empty">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>검색 결과가 없습니다</p>
    </div>`;
    return;
  }

  const hasFilter = S.checked.size > 0 || S.checkedComps.size > 0 || S.checkedTypes.size > 0;
  const units = [];

  if (hasFilter) {
    // 필터 적용 시: 서비스별 전체 카드 + 서비스 헤더 (mini-grid 구조)
    g.classList.add('filter-mode');
    let isFirst = true;
    for (const [svc, svcItems] of groups) {
      const cat = svcItems[0].category;
      const safeSvc = svc.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      units.push(`<div class="svc-group${isFirst?' first':''}">

          ${svcItems.map(item => cardTpl(item, ec)).join('')}

      </div>`);
      isFirst = false;
    }
    resetLazyObservers();
    // 그룹 단위 청크 — 그룹 하나가 카드 수십 장을 포함할 수 있어 청크 크기를 작게 잡는다.
    renderChunked(g, units, 15);
  } else {
    g.classList.remove('filter-mode');
    // 필터 없음: 서비스당 카드 1장
    for (const [svc, svcItems] of groups) {
      // 대표 스크린: 메인 우선, 없으면 첫 화면 유지 / 부제: 업종
      const repItem = svcItems.find(i => i.category === '메인') || svcItems[0];
      const svcType = getSvcType(svc);
      const safeSvc = svc.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const isPushIdx = repItem.category === '푸시알림';
      units.push(`
        <div class="svc-item" onclick="showService('${safeSvc}')">
          <div class="svc-thumb${isPushIdx?' push-notif':''}">
            <img class="svc-thumb-img" data-src="${imgUrl(repItem.path)}" alt="${svc}" decoding="async" />
          </div>
          <div class="svc-info">
            <img class="svc-info-icon" src="${iconBase()}${encodeURIComponent(svc)}.png" alt="${svc}"
              data-svc="${svc.replace(/"/g,'&quot;')}" onerror="tryNextIconExt(this)" />
            <div class="svc-info-text">
              <div class="svc-info-name">${svc}</div>
              <div class="svc-info-cat">${svcType}</div>
            </div>
          </div>
        </div>`);
    }
    resetLazyObservers();
    renderChunked(g, units, 80);
  }
}

// ── 지연 로딩 (IntersectionObserver) ────────────────────────────────────
let _lazyObserver = null;
let _unloadObserver = null;

// observer만 (재)생성 — 전체 DOM 재스캔은 하지 않음. 청크 렌더링에서 신규 삽입분만 개별 observe.
function resetLazyObservers() {
  if (_lazyObserver)  _lazyObserver.disconnect();
  if (_unloadObserver) _unloadObserver.disconnect();

  // 로드 observer: 뷰포트 800px 앞에서 미리 로드
  _lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const img = entry.target;
      const src = img.dataset.src;
      if (!src || (img.getAttribute('src') || '').endsWith(src.split('/').pop())) return;
      img.src = src;
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => img.classList.add('loaded'); // 실패해도 레이아웃 유지
      _lazyObserver.unobserve(img);
    });
  }, { rootMargin: '800px 0px', threshold: 0 });

  // 언로드 observer: 뷰포트 2000px 밖으로 나가면 src 해제
  _unloadObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) return;
      const img = entry.target;
      if (!img.getAttribute('src') || !img.dataset.src) return;
      // src=''로 비우면 img.src가 문서 URL(8.7MB index.html)을 가리키게 되므로 속성 자체를 제거한다.
      img.removeAttribute('src');
      img.classList.remove('loaded');
      // 다시 lazy observer에 등록
      _lazyObserver.observe(img);
    });
  }, { rootMargin: '2000px 0px', threshold: 0 });
}

function initLazyLoad() {
  resetLazyObservers();
  // 모든 lazy 이미지에 등록 (한 번에 전체를 그린 경우용 — 청크 렌더링 경로에서는 미사용)
  document.querySelectorAll('img[data-src]').forEach(img => {
    _lazyObserver.observe(img);
    _unloadObserver.observe(img);
  });
}

// ── 대량 카드 청크 렌더링 (메인 스레드 블로킹 방지) ──────────────────────
// 카드 수백~수천 개를 한 번에 innerHTML로 밀어넣으면 레이아웃 계산이 몰려
// 메인 스레드가 1초 이상 멈춘다(실측). 첫 청크는 즉시 그려 화면을 바로 채우고,
// 나머지는 requestAnimationFrame으로 프레임을 나눠 삽입해 끊김 없이 채운다.
// content-visibility로 건너뛴 카드의 자리 높이(--cih)를 현재 그리드 폭 기준으로 계산한다.
// 값이 실제와 어긋나면 스크롤바 길이가 튀므로, CSS의 컬럼 수·간격 브레이크포인트와 반드시 일치시킬 것.
function updateCardIntrinsic() {
  const g = document.getElementById('grid');
  if (!g) return;
  const w = window.innerWidth;
  const cols = w <= 480 ? 2 : w <= 768 ? 3 : 5;              // #grid / .mini-grid grid-template-columns
  const gap  = w <= 480 ? 12 : w <= 768 ? 16 : w <= 1100 ? 20 : 32;  // column-gap
  const cw = (g.clientWidth - gap * (cols - 1)) / cols;
  if (cw > 0) document.documentElement.style.setProperty('--cih', Math.round(cw * 812 / 375) + 'px');
}
window.addEventListener('resize', updateCardIntrinsic);

let _renderToken = 0;
function renderChunked(container, htmlUnits, chunkSize) {
  chunkSize = chunkSize || 60;
  const token = ++_renderToken;
  container.innerHTML = '';
  if (!htmlUnits.length) return;
  const tmp = document.createElement('div');
  let i = 0;
  function step() {
    if (token !== _renderToken) return; // 다른 렌더가 이미 이 화면을 대체함
    const end = Math.min(i + chunkSize, htmlUnits.length);
    tmp.innerHTML = htmlUnits.slice(i, end).join('');
    const imgs = [...tmp.querySelectorAll('img[data-src]')];
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    container.appendChild(frag);
    imgs.forEach(img => { _lazyObserver.observe(img); _unloadObserver.observe(img); });
    i = end;
    if (i < htmlUnits.length) requestAnimationFrame(step);
  }
  step();
}

let _lbPath = '', _lbPlatform = '', _lbName = '', _lbList = [], _lbIndex = -1;
function openLb(encPath, encName, encCat) {
  _lbPath = decodeURIComponent(encPath);
  _lbPlatform = PLATFORM;
  _lbName = decodeURIComponent(encName);
  const cat = decodeURIComponent(encCat);

  _lbIndex = _lbList.indexOf(_lbPath);
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);
  document.getElementById('lb-cat').textContent  = cat;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateLbNav();
}
// 통합검색에서 상대 사이트 패턴을 클릭했을 때: 페이지 이동 없이 상대 폴더 이미지를 바로 미리보기
function openLbCross(platform, encPath, encName, encCat) {
  _lbPath = decodeURIComponent(encPath);
  _lbPlatform = platform;
  _lbName = decodeURIComponent(encName);
  const cat = decodeURIComponent(encCat);
  _lbList = [];
  _lbIndex = -1;
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);
  document.getElementById('lb-cat').textContent  = cat;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  updateLbNav();
}
function updateLbNav() {
  const hasList = _lbIndex > -1 && _lbList.length > 1;
  const prevBtn = document.getElementById('lb-prev');
  const nextBtn = document.getElementById('lb-next');
  prevBtn.style.display = hasList ? 'flex' : 'none';
  nextBtn.style.display = hasList ? 'flex' : 'none';
  if (!hasList) return;
  prevBtn.disabled = _lbIndex <= 0;
  nextBtn.disabled = _lbIndex >= _lbList.length - 1;
}
function lbNav(dir) {
  if (_lbIndex < 0 || !_lbList.length) return;
  const next = _lbIndex + dir;
  if (next < 0 || next >= _lbList.length) return;
  _lbIndex = next;
  const item = DATA_BY_PATH.get(_lbList[_lbIndex]);
  if (!item) return;
  _lbPath = item.path;
  _lbPlatform = PLATFORM;
  _lbName = item.name;
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);
  document.getElementById('lb-cat').textContent  = item.category;
  updateLbNav();
}
function closeLb(e) {
  if (e && e.target !== document.getElementById('lightbox') && !e.target.closest('.lb-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
async function dlFromLb() {
  if (!_lbPath) return;
  aTrack('download', { count: 1 });
  try {
    const res = await fetch(dlUrl(_lbPath, _lbPlatform));
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = _lbName + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch {
    const a = document.createElement('a');
    a.href = imgUrl(_lbPath, _lbPlatform); a.download = _lbName + '.png';
    a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLb(); return; }
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

// ── URL 상태 동기화 ────────────────────────────────────────────────────────
function syncUrl() {
  const params = new URLSearchParams();
  if (S.checked.size)      params.set('cat',  [...S.checked].join(','));
  if (S.checkedComps.size) params.set('comp', [...S.checkedComps].join(','));
  if (S.checkedTypes.size) params.set('type', [...S.checkedTypes].join(','));
  if (S.view === 'detail' && S.svc) params.set('svc', S.svc);
  const qs = params.toString();
  history.replaceState(null, '', qs ? '#' + qs : location.pathname + location.search);
}

function readUrl() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  try {
    const params = new URLSearchParams(hash);
    const cat  = params.get('cat');
    const comp = params.get('comp');
    const type = params.get('type');
    const svc  = params.get('svc');
    if (cat)  cat.split(',').forEach(c => { if (c && ALL_CATS.includes(c)) S.checked.add(c); });
    if (comp) comp.split(',').forEach(c => { if (c && COMPONENTS.includes(c)) S.checkedComps.add(c); });
    if (type) type.split(',').forEach(t => { if (t) S.checkedTypes.add(t); });
    if (svc)  { S.view = 'detail'; S.svc = svc.trim().normalize('NFC'); }
  } catch(e) {}
}

window.addEventListener('popstate', () => { readUrl(); buildSidebar(); render(); });

document.addEventListener('DOMContentLoaded', () => {
  readUrl(); buildSidebar(); render();
  if (window.lucide) lucide.createIcons();
});

// ════════════════════════════════════════════
// 자동 새로고침 (file:// 호환)
// version.js를 주기적으로 다시 불러와 버전이 바뀌면 페이지를 새로고침.
// update-index.js가 폴더 스캔 후 version.js의 __UIP_VER 값을 갱신한다.
// fetch는 file://에서 막히므로 <script> 주입 방식 사용.
// ════════════════════════════════════════════
(function autoReload() {
  // 로컬 미리보기(file://, localhost)에서만 동작 — 배포된 사이트는 push로만 바뀌므로 폴링할 필요가 없다.
  if (location.protocol !== 'file:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  const INTERVAL = 2500;
  let baseVer = null;
  function poll() {
    const s = document.createElement('script');
    s.src = 'version.js?_=' + Date.now();
    s.onload = () => {
      const v = window.__UIP_VER;
      if (v) {
        if (baseVer === null) baseVer = v;
        else if (v !== baseVer) { location.reload(); return; }
      }
      s.remove();
      setTimeout(poll, INTERVAL);
    };
    s.onerror = () => { s.remove(); setTimeout(poll, INTERVAL); };
    document.head.appendChild(s);
  }
  poll();
})();

// ════════════════════════════════════════════
// PLATFORM (mo/web 통합 사용현황용)
// ════════════════════════════════════════════
// 서버·로컬 모두 폴더명(/mo/ 또는 /web/)으로 판별. 둘 다 아니면(예: 루트) mo로 취급.
const PLATFORM = location.pathname.includes('/web/') ? 'web' : 'mo';
let dashTab = 'all'; // '사용 현황' 패널에서 선택된 탭: 'all' | 'mo' | 'web'

// ════════════════════════════════════════════
// ANALYTICS (localStorage 기반)
// ════════════════════════════════════════════
// AK는 mo/web 양쪽 페이지에서 동일한 키를 쓴다 — 같은 도메인(서버)에서 열람하면
// localStorage가 오리진 단위로 공유되므로, 두 사이트의 활동 기록이 자동으로 합쳐진다.
// (file://로 각각 열면 브라우저별로 오리진이 분리돼 합쳐지지 않을 수 있음)
const AK = 'uip_analytics_v1';
function aGet() { try { return JSON.parse(localStorage.getItem(AK) || '{}'); } catch { return {}; } }
function aSave(d) { try { localStorage.setItem(AK, JSON.stringify(d)); } catch {} }

// 기존 오타 검색어 일괄 삭제 (1회 실행 후 플래그 설정)
(function clearOldSearches() {
  if (localStorage.getItem('uip_searches_cleared')) return;
  const d = aGet(); d.searches = []; aSave(d);
  localStorage.setItem('uip_searches_cleared', '1');
})();

function aTrack(event, payload) {
  const d = aGet();
  const today = new Date().toISOString().slice(0, 10);
  d.daily = d.daily || {};
  d.services = d.services || {};
  d.categories = d.categories || {};
  d.downloads = d.downloads || 0;
  d.searches = d.searches || [];
  // 플랫폼별 분리 집계 — '사용 현황'의 모바일/웹사이트 탭에서 사용.
  // (기존 flat 필드는 '전체' 탭용으로 계속 함께 채워 하위호환 유지)
  d.byPlatform = d.byPlatform || {};
  const p = d.byPlatform[PLATFORM] = d.byPlatform[PLATFORM] || { daily: {}, services: {}, categories: {}, downloads: 0, searches: [] };
  if (event === 'view_service') {
    d.daily[today] = (d.daily[today] || 0) + 1;
    p.daily[today] = (p.daily[today] || 0) + 1;
    if (payload?.svc) {
      d.services[payload.svc] = (d.services[payload.svc] || 0) + 1;
      p.services[payload.svc] = (p.services[payload.svc] || 0) + 1;
    }
  }
  if (event === 'filter_cat' && payload?.cat) {
    d.categories[payload.cat] = (d.categories[payload.cat] || 0) + 1;
    p.categories[payload.cat] = (p.categories[payload.cat] || 0) + 1;
  }
  if (event === 'download') {
    d.downloads += (payload?.count || 1);
    p.downloads += (payload?.count || 1);
  }
  if (event === 'search' && payload?.q?.length >= 2) {
    d.searches = [payload.q, ...d.searches.filter(s => s !== payload.q)].slice(0, 30);
    p.searches = [payload.q, ...p.searches.filter(s => s !== payload.q)].slice(0, 30);
  }
  aSave(d);
}
