# worker/ 가 바뀌면 이미지 중계(Cloudflare Worker)를 자동 배포한다.
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN (권한: Workers Scripts Edit), CLOUDFLARE_ACCOUNT_ID 를 등록 (worker/README.md 참고)
name: Deploy image proxy

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.WORKER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
