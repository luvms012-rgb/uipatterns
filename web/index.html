<script>

window.DATA = DATA;

// 영문 우선 → 한글 순 정렬
function sortMixed(a, b) {
  const aKo = /^[ㄱ-ㅎ가-힣]/.test(a);
  const bKo = /^[ㄱ-ㅎ가-힣]/.test(b);
  if (aKo !== bKo) return aKo ? 1 : -1;
  return a.localeCompare(b, aKo ? 'ko' : 'en', { sensitivity: 'base' });
}
const DISPLAY_DATA = DATA.filter(i => i.category !== 'icons');
const DATA_BY_PATH = new Map(DISPLAY_DATA.map(i => [i.path, i]));
const ALL_CATS = [...new Set(DISPLAY_DATA.map(i => i.category))].sort(sortMixed);
const CAT_COUNTS = {};
DISPLAY_DATA.forEach(i => { CAT_COUNTS[i.category] = (CAT_COUNTS[i.category]||0)+1; });

const S = { checked: new Set(), checkedComps: new Set(), checkedColors: new Set(), checkedTypes: new Set(), selected: new Set(), view: 'index', svc: null, q: '' };

// SVC_TYPES에 없는 새 서비스는 '미분류'로 자동 분류 (수동 매핑 전까지 사이드바에 자동 노출)
const UNCLASSIFIED = '미분류';
function getSvcType(svcName) { return SVC_TYPES[svcName] || UNCLASSIFIED; }


// 업종별 아이템 수 계산
const TYPE_COUNTS = {};
DISPLAY_DATA.forEach(item => {
  const t = getSvcType(extractService(item.name));
  if (t) TYPE_COUNTS[t] = (TYPE_COUNTS[t]||0) + 1;
});

// ── 이미지 주소 ──────────────────────────────────────────────────────────
// 이미지는 회사 서버(UIP_CONFIG.imgBase)에만 있다. 화면 표시는 원본 주소를 바로 쓰고,
// 다운로드처럼 파일 내용을 읽어야 할 때만 이미지 중계(UIP_CONFIG.imgProxy)를 거친다
// (회사 서버에 CORS 헤더가 없어 github.io에서 직접 fetch하면 브라우저가 막는다).
function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
function imgUrl(p, platform = PLATFORM) { return UIP_CONFIG.imgBase + platform + '/' + encodePath(p); }
function dlUrl(p, platform = PLATFORM) {
  if (!UIP_CONFIG.imgProxy) return imgUrl(p, platform);
  return UIP_CONFIG.imgProxy.replace(/\/$/, '') + '/' + platform + '/' + encodePath(p);
}
function iconBase(platform = PLATFORM) { return UIP_CONFIG.imgBase + platform + '/icons/'; }

// 이미지 파일 내용을 읽을 수 있나 — 중계(imgProxy)가 있거나, 이미지가 이 페이지와 같은 출처일 때(로컬 미리보기)만.
// 회사 서버는 다른 사이트에서 파일을 읽어 가는 것을 허용하지 않아(CORS 헤더 없음) github.io·file:// 에서는 못 읽는다.
function canReadImages() {
  if (UIP_CONFIG.imgProxy) return true;
  if (location.protocol === 'file:') return false;
  // 운영(회사 서버)·로컬 미리보기처럼 페이지와 이미지가 같은 서버면 읽을 수 있다
  try { return new URL(UIP_CONFIG.imgBase, location.href).origin === location.origin; } catch { return false; }
}

// 파일로 바로 저장할 수 없을 때: 새 창 하나에 이미지를 모아 보여준다 (오른쪽 클릭 → 이미지를 다른 이름으로 저장).
// 여러 창을 차례로 열면 브라우저가 첫 창만 열고 나머지는 팝업으로 막으므로 한 창에 모은다.
// 클릭 직후(기다림 없이) 불러야 팝업으로 막히지 않는다.
function openImagesWindow(items) {
  const win = window.open('', '_blank');
  if (!win) { showToast('팝업이 막혔어요. 주소창 오른쪽에서 이 사이트의 팝업을 허용해 주세요'); return false; }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const one = items.length === 1;
  const title = one ? items[0].path.split('/').pop() : items.length + '장';
  win.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0c0c0e;color:#f0f0f2;font-family:Pretendard,system-ui,sans-serif;padding:72px 24px 40px}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(12,12,14,.92);border-bottom:1px solid #32343e;z-index:1}
  .bar p{flex:1;font-size:14px;color:#c9cbd4}.bar b{color:#f0f0f2}
  .bar button{height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.12);border:none;cursor:pointer;color:#fff;font-size:13px;font-family:inherit}

async function dlImg(encPath, encName) {
  const path = decodeURIComponent(encPath);
  const name = decodeURIComponent(encName) + '.png';
  aTrack('download', { count: 1 });
  if (!canReadImages()) { openImagesWindow([{ path, name }]); return; }
  try {
    const res = await fetch(dlUrl(path));
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch {
    openImagesWindow([{ path, name }]);
  }
}

// 아이콘 확장자 순차 시도 (png → webp → jpg → 숨김)
const ICON_EXTS = ['webp', 'jpg'];
function tryNextIconExt(el) {
  const svc = el.dataset.svc || el.alt;
  const base = el.dataset.iconBase || iconBase();
  const tried = (el.dataset.iconTry | 0);
  if (tried < ICON_EXTS.length) {
    el.dataset.iconTry = tried + 1;
    el.src = base + encodeURIComponent(svc) + '.' + ICON_EXTS[tried];
  } else {
    el.setAttribute('data-missing', '1');
  }
}

function extractService(name) {
  return name.split('_')[0].trim().normalize('NFC');
}
function extractPattern(name) {
  const parts = name.split('_');
  // 구조: 서비스_패턴_번호_날짜 → 패턴명 추출 (없으면 빈 문자열)
  if (parts.length <= 3) return '';
  return parts.slice(1, -2).join(' ');
}

function getItems() {
  return DISPLAY_DATA.filter(item => {
    if (S.checked.size && !S.checked.has(item.category)) return false;
    if (S.checkedComps.size && !(item.comps || []).some(c => S.checkedComps.has(c))) return false;
    if (S.checkedColors.size && !S.checkedColors.has(item.color)) return false;
    if (S.checkedTypes.size) {
      const t = getSvcType(extractService(item.name));
      if (!t || !S.checkedTypes.has(t)) return false;
    }
    return true;
  });
}

let crossSearchIndex = null;
let crossSearchPromise = null;
function loadCrossSearchIndex() {
  if (crossSearchPromise) return crossSearchPromise;
  const otherPlatform = PLATFORM === 'mo' ? 'web' : 'mo';
  crossSearchPromise = new Promise(resolve => {
    const s = document.createElement('script');
    s.src = '../' + otherPlatform + '/search-index.js?_=' + Date.now();
    s.onload = () => { crossSearchIndex = window.__SEARCH_INDEX__ || null; s.remove(); resolve(crossSearchIndex); };
    s.onerror = () => { s.remove(); resolve(null); };
    document.head.appendChild(s);
  });
  return crossSearchPromise;
}

function onSearchInput(v) {
  const q = v.trim();
  const drop = document.getElementById('searchDrop');
  if (!q) { drop.innerHTML = buildSearchHome(); drop.classList.toggle('open', AC.rows.length > 0); return; }  // 빈 검색창: 최근 검색어, 추천 조합
  if (q.length < 2) { drop.classList.remove('open'); return; }

  // 상대 사이트 인덱스가 아직 없으면 백그라운드로 불러온 뒤, 입력값이 그대로면 다시 그린다
  if (!crossSearchIndex) {
    loadCrossSearchIndex().then(() => {
      const cur = document.getElementById('hdrSearchInput');
      // 검색창에 커서가 있을 때만 (엔터로 결과 페이지로 넘어간 뒤 드롭다운이 다시 열리지 않도록)
      if (cur && cur.value.trim() === q && document.activeElement === cur) onSearchInput(q);
    });
  }

  // 자동완성: 전체보기 + UX 패턴, 여러 단어면 조합 보기 + 단어 하나씩 (../assets/search.js)
  drop.innerHTML = buildAutocomplete(q);
  drop.classList.add('open');
}

function toggleSelect(el) {

    S.selected.delete(path);
    el.classList.remove('selected');
    const chk = el.querySelector('.sel-chk'); if (chk) chk.firstElementChild.checked = false;
  } else {

  }
  updateSelectBar();

  const cards = [...document.querySelectorAll('.card[data-path]')];

      c.classList.remove('selected');
      const chk = c.querySelector('.sel-chk'); if (chk) chk.firstElementChild.checked = false;

// 선택 다운로드 — 묶지 않고 원래 파일명 그대로, 선택한 것을 전부 한 번에 다운로드 폴더로 받는다.
//  1) 이미지를 읽을 수 있으면(운영: 회사 서버 · 로컬 미리보기 · 중계 있음) — 차례로 바로 다운로드
//     (브라우저가 처음 한 번 '여러 파일 다운로드 허용'을 묻는다)
//  2) 못 읽으면(개발 기간 github.io: 이미지가 다른 서버) — 새 창 하나에 모아 보여준다 (오른쪽 클릭으로 저장)
async function dlSelected() {
  const items = DISPLAY_DATA.filter(i => S.selected.has(i.path));
  if (!items.length) return;
  const cnt = items.length;
  const btn = document.getElementById('sb-dl-btn');
  const DL_SVG_SM = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  const fileName = item => item.path.split('/').pop();
  const finish = () => { if (btn) btn.innerHTML = `${DL_SVG_SM} 다운로드`; exitSelectMode(); updateSelectBar(); };

  if (!canReadImages()) {
    aTrack('download', { count: cnt });
    if (openImagesWindow(items)) showToast(`${cnt}장을 새 창에 열었어요. 이미지를 오른쪽 클릭해 저장하세요`);
    finish();
    return;
  }

  async function getBlob(item) {
    const res = await fetch(dlUrl(item.path));
    if (!res.ok) throw new Error('fetch ' + res.status);
    return res.blob();
  }

  if (btn) btn.disabled = true;
  if (cnt > 1) showToast(`${cnt}장을 다운로드 폴더로 받아요. '여러 파일 다운로드'를 물으면 허용해 주세요`);
  const failed = [];
  for (let i = 0; i < cnt; i++) {
    const item = items[i];
    if (btn) btn.innerHTML = `${DL_SVG_SM} ${i + 1} / ${cnt} 받는 중`;
    try {
      const url = URL.createObjectURL(await getBlob(item));
      const a = document.createElement('a');
      a.href = url; a.download = fileName(item);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    } catch { failed.push(item); }
    if (i < cnt - 1) await new Promise(r => setTimeout(r, 250));   // 한꺼번에 몰아치면 브라우저가 일부를 빠뜨린다
  }
  aTrack('download', { count: cnt - failed.length });
  // 두 번째 파일부터는 브라우저가 사이트마다 처음 한 번 '자동 다운로드 허용'을 묻는다 (주소창 오른쪽)
  if (!failed.length) showToast(cnt > 1 ? `${cnt}장 다운로드 완료 · 빠진 파일이 있으면 주소창 오른쪽에서 '자동 다운로드 허용'을 눌러 주세요` : `${cnt}장 다운로드 완료`);
  else if (openImagesWindow(failed)) showToast(`${cnt - failed.length}장 받음 · 못 받은 ${failed.length}장은 새 창에 열었어요`);
  if (btn) btn.disabled = false;
  finish();
}

function render() {
  buildChips();
  updateCardIntrinsic();
  const g = document.getElementById('grid');
  const ec = encodeURIComponent;

  if (!DISPLAY_DATA.length) {
    g.classList.remove('filter-mode');
    g.innerHTML = `<div class="ds-empty empty">
      <span class="ds-empty__media"><i class="ds-icon ds-icon--inbox" aria-hidden="true"></i></span>
      <p class="ds-empty__title">이미지가 없습니다</p>
      <p class="ds-empty__desc">카테고리 폴더에 이미지를 추가한 뒤 update.bat을 실행하세요</p>
    </div>`;
    return;
  }

  // ── 검색 결과: 검색창에서 엔터 (../assets/search.js) ─────────────────────
  if (S.view === 'search' && S.q) { renderSearch(); return; }
  setToolbarTitle(null);

  // ── 디테일 모드: 선택된 서비스의 전체 스크린 ─────────────────────────────
  if (S.view === 'detail' && S.svc) {
    const svcItems = DISPLAY_DATA.filter(i => extractService(i.name) === S.svc);
    if (!svcItems.length) { backToIndex(); return; }
    const cat = svcItems[0].category;
    const dh = document.getElementById('detail-header');
    dh.style.display = 'block';
    dh.innerHTML = `<div class="detail-bar">
      <button type="button" class="ds-btn back-btn" data-variant="neutralWeak" data-size="small" onclick="backToIndex()" aria-label="목록으로 돌아가기">
        <i class="ds-icon ds-icon--chevron-left" aria-hidden="true"></i><span>목록</span>
      </button>
      <img class="svc-h-icon" src="${iconBase()}${encodeURIComponent(S.svc)}.png" alt="${S.svc}"
        data-svc="${S.svc.replace(/"/g,'&quot;')}" onerror="tryNextIconExt(this)">
      <div class="svc-h-info">
        <span class="svc-h-name">${S.svc}</span>
        <span class="svc-h-cat">${cat}</span>
      </div>
    </div>`;
    g.classList.remove('filter-mode');
    resetLazyObservers();
    renderChunked(g, svcItems.map(item => cardTpl(item, ec)));
    return;
  }
  document.getElementById('detail-header').style.display = 'none';

  // ── 인덱스 모드: 서비스당 카드 1장 ──────────────────────────────────────
  const items = getItems();
  // svc별 이미지 배열 + 최신 날짜를 한 번의 순회로 함께 계산한다.
  // (예전엔 정렬 비교함수 안에서 매번 배열 전체를 훑어 최신 날짜를 재계산했는데,
  //  이미지가 많은 서비스가 비교될 때마다 반복 재계산되어 O(N log N × 그룹크기)로
  //  폭증했다 — mo 실측 기준 524개 서비스 정렬에 1.46초까지 걸린 것을 확인. 그룹핑 시
  //  1회만 계산해두는 것으로 40ms 미만까지 줄어든다.)
  const groupsRaw = new Map(); // svc -> { items:[], maxDate:'' }
  items.forEach(item => {
    const svc = extractService(item.name);
    let g2 = groupsRaw.get(svc);
    if (!g2) { g2 = { items: [], maxDate: '' }; groupsRaw.set(svc, g2); }
    g2.items.push(item);
    const d = item.name.split('_').pop();
    if (d > g2.maxDate) g2.maxDate = d;
  });
  const sortedEntries = [...groupsRaw.entries()].sort((a, b) => {
    const da = a[1].maxDate, db = b[1].maxDate;
    return da === db ? sortMixed(a[0], b[0]) : (da < db ? 1 : -1);
  });
  const groups = new Map(sortedEntries.map(([svc, g2]) => [svc, g2.items]));

  if (!groups.size) {
    g.classList.remove('filter-mode');
    g.innerHTML = `<div class="ds-empty empty">
      <span class="ds-empty__media"><i class="ds-icon ds-icon--search" aria-hidden="true"></i></span>
      <p class="ds-empty__title">검색 결과가 없습니다</p>
    </div>`;
    return;
  }

  const hasFilter = S.checked.size > 0 || S.checkedComps.size > 0 || S.checkedColors.size > 0 || S.checkedTypes.size > 0;
  const units = [];

  if (hasFilter) {
    // 필터 적용 시: 서비스별 전체 카드 + 서비스 헤더 (mini-grid 구조)
    g.classList.add('filter-mode');
    let isFirst = true;
    for (const [svc, svcItems] of groups) {
      const cat = svcItems[0].category;
      const safeSvc = svc.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      units.push(`<div class="svc-group${isFirst?' first':''}">
        <div class="svc-header" onclick="showService('${safeSvc}')" style="cursor:pointer" title="${svc} 전체 화면 보기">
          <img class="svc-h-icon" src="${iconBase()}${encodeURIComponent(svc)}.png" alt="${svc}"
            data-svc="${svc.replace(/"/g,'&quot;')}" onerror="tryNextIconExt(this)">
          <div class="svc-h-info">
            <span class="svc-h-name">${svc}</span>
            <span class="svc-h-cat">${cat}</span>
          </div>
        </div>
        <div class="mini-grid">
          ${svcItems.map(item => cardTpl(item, ec)).join('')}
        </div>
      </div>`);
      isFirst = false;
    }
    resetLazyObservers();
    // 그룹 단위 청크 — 그룹 하나가 카드 수십 장을 포함할 수 있어 청크 크기를 작게 잡는다.
    renderChunked(g, units, 15);
  } else {
    g.classList.remove('filter-mode');
    // 필터 없음: 서비스당 카드 1장
    for (const [svc, svcItems] of groups) {
      // 대표 스크린: 메인→랜딩페이지 우선, 없으면 첫 화면 유지 / 부제: 업종
      const repItem = svcItems.find(i => i.category === '메인') || svcItems.find(i => i.category === '랜딩페이지') || svcItems[0];
      const svcType = getSvcType(svc);
      const safeSvc = svc.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      const isPushIdx = repItem.category === '푸시알림';
      units.push(`
        <div class="svc-item" onclick="showService('${safeSvc}')">
          <div class="svc-thumb${isPushIdx?' push-notif':''}">
            <img class="svc-thumb-img" data-src="${imgUrl(repItem.path)}" alt="${svc}" decoding="async" />
          </div>
          <div class="svc-info">
            <img class="svc-info-icon" src="${iconBase()}${encodeURIComponent(svc)}.png" alt="${svc}"
              data-svc="${svc.replace(/"/g,'&quot;')}" onerror="tryNextIconExt(this)" />
            <div class="svc-info-text">
              <div class="svc-info-name">${svc}</div>
              <div class="svc-info-cat">${svcType}</div>
            </div>
          </div>
        </div>`);
    }
    resetLazyObservers();
    renderChunked(g, units, 80);
  }
}

// ── 지연 로딩 (IntersectionObserver) ────────────────────────────────────
let _lazyObserver = null;
let _unloadObserver = null;

// observer만 (재)생성 — 전체 DOM 재스캔은 하지 않음. 청크 렌더링에서 신규 삽입분만 개별 observe.
function resetLazyObservers() {
  if (_lazyObserver)  _lazyObserver.disconnect();
  if (_unloadObserver) _unloadObserver.disconnect();

  // 로드 observer: 뷰포트 800px 앞에서 미리 로드
  _lazyObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const img = entry.target;
      const src = img.dataset.src;
      if (!src || (img.getAttribute('src') || '').endsWith(src.split('/').pop())) return;
      img.src = src;
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => img.classList.add('loaded'); // 실패해도 레이아웃 유지
      _lazyObserver.unobserve(img);
    });
  }, { rootMargin: '800px 0px', threshold: 0 });

  // 언로드 observer: 뷰포트 2000px 밖으로 나가면 src 해제
  _unloadObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) return;
      const img = entry.target;
      if (!img.getAttribute('src') || !img.dataset.src) return;
      // src=''로 비우면 img.src가 문서 URL(수 MB index.html)을 가리키게 되므로 속성 자체를 제거한다.
      img.removeAttribute('src');
      img.classList.remove('loaded');
      // 다시 lazy observer에 등록
      _lazyObserver.observe(img);
    });
  }, { rootMargin: '2000px 0px', threshold: 0 });
}

function initLazyLoad() {
  resetLazyObservers();
  // 모든 lazy 이미지에 등록 (한 번에 전체를 그린 경우용 — 청크 렌더링 경로에서는 미사용)
  document.querySelectorAll('img[data-src]').forEach(img => {
    _lazyObserver.observe(img);
    _unloadObserver.observe(img);
  });
}

// ── 대량 카드 청크 렌더링 (메인 스레드 블로킹 방지) ──────────────────────
// 카드 수백~수천 개를 한 번에 innerHTML로 밀어넣으면 레이아웃 계산이 몰려
// 메인 스레드가 1초 이상 멈춘다(실측). 첫 청크는 즉시 그려 화면을 바로 채우고,
// 나머지는 requestAnimationFrame으로 프레임을 나눠 삽입해 끊김 없이 채운다.
// content-visibility로 건너뛴 카드의 자리 높이(--cih)를 현재 그리드 폭 기준으로 계산한다.
// 열 수와 간격을 CSS 에서 읽으므로 브레이크포인트나 열 필터가 바뀌어도 따로 맞출 필요 없다.
function updateCardIntrinsic() {
  const g = document.getElementById('grid');
  if (!g) return;
  // 열 수와 간격은 CSS 가 정한 값을 그대로 읽는다 (열 필터, 브레이크포인트 모두 반영)
  const cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-cols')) || 1;
  const gap  = parseFloat(getComputedStyle(g).columnGap) || 0;
  const cw = (g.clientWidth - gap * (cols - 1)) / cols;
  if (cw > 0) document.documentElement.style.setProperty('--cih', Math.round(cw * 900 / 1440) + 'px');
}
window.addEventListener('resize', updateCardIntrinsic);

let _renderToken = 0;
function renderChunked(container, htmlUnits, chunkSize) {
  chunkSize = chunkSize || 60;
  const token = ++_renderToken;
  container.innerHTML = '';
  if (!htmlUnits.length) return;
  const tmp = document.createElement('div');
  let i = 0;
  function step() {
    if (token !== _renderToken) return; // 다른 렌더가 이미 이 화면을 대체함
    const end = Math.min(i + chunkSize, htmlUnits.length);
    tmp.innerHTML = htmlUnits.slice(i, end).join('');
    const imgs = [...tmp.querySelectorAll('img[data-src]')];
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    container.appendChild(frag);
    imgs.forEach(img => { _lazyObserver.observe(img); _unloadObserver.observe(img); });
    i = end;
    if (i < htmlUnits.length) requestAnimationFrame(step);
  }
  step();
}

// ── 라이트박스 ───────────────────────────────────────────────────────────
let _lbPath = '', _lbPlatform = '', _lbName = '', _lbList = [], _lbIndex = -1;
function openLb(encPath, encName, encCat) {
  _lbPath = decodeURIComponent(encPath);
  _lbPlatform = PLATFORM;
  _lbName = decodeURIComponent(encName);
  const cat = decodeURIComponent(encCat);
  _lbList = [...document.querySelectorAll('#grid [data-path]')].map(el => el.dataset.path);
  _lbIndex = _lbList.indexOf(_lbPath);
  if (_lbIndex < 0) {  // 화면 링크로 바로 들어온 경우 등: 같은 서비스 화면을 이전/다음으로
    const svc = extractService(_lbName);
    _lbList = DISPLAY_DATA.filter(i => extractService(i.name) === svc).map(i => i.path);
    _lbIndex = _lbList.indexOf(_lbPath);
  }
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);
  document.getElementById('lb-cat').textContent  = cat;

}
// 통합검색에서 상대 사이트 패턴을 클릭했을 때: 페이지 이동 없이 상대 폴더 이미지를 바로 미리보기
function openLbCross(platform, encPath, encName, encCat) {
  _lbPath = decodeURIComponent(encPath);
  _lbPlatform = platform;
  _lbName = decodeURIComponent(encName);
  const cat = decodeURIComponent(encCat);
  _lbList = [];
  _lbIndex = -1;
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);

  document.body.style.overflow = 'hidden';
  updateLbNav(); renderLbMore();
}
function updateLbNav() {
  const hasList = _lbIndex > -1 && _lbList.length > 1;
  const prevBtn = document.getElementById('lb-prev');
  const nextBtn = document.getElementById('lb-next');
  prevBtn.style.display = hasList ? '' : 'none';
  nextBtn.style.display = hasList ? '' : 'none';
  if (!hasList) return;
  prevBtn.disabled = _lbIndex <= 0;
  nextBtn.disabled = _lbIndex >= _lbList.length - 1;
}
function lbNav(dir) {
  if (_lbIndex < 0 || !_lbList.length) return;
  const next = _lbIndex + dir;
  if (next < 0 || next >= _lbList.length) return;
  _lbIndex = next;
  const item = DATA_BY_PATH.get(_lbList[_lbIndex]);
  if (!item) return;
  _lbPath = item.path;
  _lbPlatform = PLATFORM;
  _lbName = item.name;
  document.getElementById('lb-img').src = imgUrl(_lbPath, _lbPlatform);
  document.getElementById('lb-name').textContent = extractService(_lbName);
  document.getElementById('lb-cat').textContent  = item.category;
  updateLbNav(); renderLbMore();
  syncUrl();
}
// 이어 보기: 보고 있는 화면에서 같은 서비스 · 같은 카테고리 · 같은 컴포넌트 · 웹/모바일 짝으로 바로 가기 (10/31)
const _lbSvcKey = s => String(s || '').normalize('NFC').toLowerCase().replace(/\s+/g, '');
function renderLbMore() {
  const box = document.getElementById('lb-more');
  const ec = encodeURIComponent, esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const chip = (label, onclick, icon) => `<button type="button" class="ds-chip lb-more-chip" data-size="small" data-variant="outlineWeak" onclick="event.stopPropagation();${onclick}">` +
    (icon ? `<i class="ds-icon ds-icon--${icon}" aria-hidden="true"></i>` : '') + esc(label) + '</button>';
  const svc = extractService(_lbName);
  const cross = _lbPlatform !== PLATFORM;          // 통합검색에서 상대 사이트 화면을 미리보기 중
  const item = cross ? null : DATA_BY_PATH.get(_lbPath);
  const chips = [];
  if (!cross) {
    const n = DISPLAY_DATA.filter(i => extractService(i.name) === svc).length;
    if (n > 1 && !(S.view === 'detail' && S.svc === svc)) chips.push(chip(`${svc} 화면 ${n}장`, `lbGo('svc','${ec(svc)}')`));
    if (item && item.category) chips.push(chip(`${item.category} 다른 서비스`, `lbGo('cat','${ec(item.category)}')`));
    for (const c of (item && item.comps || []).slice(0, 8)) chips.push(chip(`${c} 쓰인 화면`, `lbGo('comp','${ec(c)}')`));
  }
  box.innerHTML = chips.join('');
  box.style.display = chips.length ? '' : 'none';

  // 상대 사이트(웹 ↔ 모바일)에 같은 서비스가 있으면 그쪽 서비스 페이지로 (search-index.js 는 처음 한 번만 불러옴)
  const path = _lbPath, other = PLATFORM === 'mo' ? 'web' : 'mo';
  loadCrossSearchIndex().then(idx => {
    if (_lbPath !== path) return;   // 그 사이 다른 화면으로 넘어감
    const hit = idx && (idx.svcs || []).find(x => _lbSvcKey(x.svc) === _lbSvcKey(svc));
    if (cross) {   // 상대 사이트 화면을 보는 중: 그 서비스의 화면 전체는 상대 사이트에서, 이쪽에도 있으면 이쪽 서비스로
      if (hit) box.insertAdjacentHTML('beforeend', chip(`${svc} ${other === 'web' ? '웹' : '모바일'} 화면 ${hit.count}장`, `lbGoOther('${ec(hit.svc)}')`, 'external-link'));
      const n = DISPLAY_DATA.filter(i => extractService(i.name) === svc).length;
      if (n && !(S.view === 'detail' && S.svc === svc)) box.insertAdjacentHTML('beforeend', chip(`${PLATFORM === 'mo' ? '모바일' : '웹'} 버전 ${n}장`, `lbGo('svc','${ec(svc)}')`, PLATFORM === 'mo' ? 'smartphone' : 'monitor'));
    } else if (hit) {
      box.insertAdjacentHTML('beforeend', chip(`${other === 'web' ? '웹' : '모바일'} 버전 ${hit.count}장`, `lbGoOther('${ec(hit.svc)}')`, other === 'web' ? 'monitor' : 'smartphone'));
    }
    box.style.display = box.children.length ? '' : 'none';
  });
}
function lbGo(kind, enc) {   // kind: svc(서비스 페이지) | cat(카테고리 필터) | comp(컴포넌트 필터). 다른 필터는 모두 풀어서 결과가 예측되게
  const v = decodeURIComponent(enc);
  closeLb();
  S.selected.clear(); document.getElementById('select-bar').classList.remove('open');
  S.checked.clear(); S.checkedComps.clear(); S.checkedColors.clear(); S.checkedTypes.clear();
  if (kind === 'cat') S.checked.add(v);
  if (kind === 'comp') S.checkedComps.add(v);
  S.view = kind === 'svc' ? 'detail' : 'index'; S.svc = kind === 'svc' ? v : null;
  buildSidebar(); render(); syncUrl();

}
function lbGoOther(encSvc) {   // 상대 사이트의 서비스 페이지로 (같은 탭)
  const other = PLATFORM === 'mo' ? 'web' : 'mo';
  location.href = new URL('../' + other + '/', location.href).href + '#svc=' + encSvc;
}
function closeLb(e) {

// 화면 1장 링크: 사이트/#img=카테고리/파일.png — 열면 바로 크게 보기 (Claude 검색 답변, 팀원 공유용)
function lbLink() {

}
async function copyLbLink() {
  if (!_lbPath) return;

// 주소의 #img= 로 들어왔을 때 (readUrl 이 넣어 둠) 목록을 그린 뒤 그 화면을 연다

async function dlFromLb() {
  if (!_lbPath) return;
  aTrack('download', { count: 1 });
  try {
    const res = await fetch(dlUrl(_lbPath, _lbPlatform));
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = _lbName + '.png';

document.addEventListener('keydown', e => {

// ── URL 상태 동기화 ────────────────────────────────────────────────────────
function syncUrl() {
  const params = new URLSearchParams();
  if (S.checked.size)      params.set('cat',  [...S.checked].join(','));
  if (S.checkedComps.size) params.set('comp', [...S.checkedComps].join(','));
  if (S.checkedColors.size) params.set('color', [...S.checkedColors].join(','));
  if (S.checkedTypes.size) params.set('type', [...S.checkedTypes].join(','));
  if (S.view === 'detail' && S.svc) params.set('svc', S.svc);
  if (S.view === 'search' && S.q)   params.set('q', S.q);
  if (S.view === 'search' && S.q && SR_OFF.size) params.set('x', [...SR_OFF].join(','));  // 뺀 비슷한 말
  if (_lbPath && _lbPlatform === PLATFORM && document.getElementById('lightbox').classList.contains('open')) params.set('img', _lbPath);  // 크게 보기 중인 화면
  const qs = params.toString();
  history.replaceState(null, '', qs ? '#' + qs : location.pathname + location.search);
}

function readUrl() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  try {
    const params = new URLSearchParams(hash);
    const cat  = params.get('cat');
    const comp = params.get('comp');
    const color = params.get('color');
    const type = params.get('type');
    const svc  = params.get('svc');
    const q    = params.get('q');
    if (cat)  cat.split(',').forEach(c => { if (c && ALL_CATS.includes(c)) S.checked.add(c); });
    if (comp) comp.split(',').forEach(c => { if (c && COMPONENTS.includes(c)) S.checkedComps.add(c); });
    if (color) color.split(',').forEach(c => { if (COLOR_LIST.some(x => x.name === c)) S.checkedColors.add(c); });
    if (type) type.split(',').forEach(t => { if (t) S.checkedTypes.add(t); });
    if (svc)  { S.view = 'detail'; S.svc = svc.trim().normalize('NFC'); }
    if (q && q.trim()) { S.view = 'search'; S.q = q.trim(); document.getElementById('hdrSearchInput').value = S.q; }
    SR_OFF.clear(); (params.get('x') || '').split(',').filter(Boolean).forEach(w => SR_OFF.add(normCat(w)));
    const img = params.get('img'); if (img) _pendingImg = img.normalize('NFC');
  } catch(e) {}
}

// ════════════════════════════════════════════
// 자동 새로고침 (file:// 호환)
// version.js를 주기적으로 다시 불러와 버전이 바뀌면 페이지를 새로고침.
// update-index.js가 폴더 스캔 후 version.js의 __UIP_VER 값을 갱신한다.
// fetch는 file://에서 막히므로 <script> 주입 방식 사용.
// ════════════════════════════════════════════
(function autoReload() {
  // 로컬 미리보기(file://, localhost)에서만 동작 — 배포된 사이트는 push로만 바뀌므로 폴링할 필요가 없다.
  if (location.protocol !== 'file:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  const INTERVAL = 2500;
  let baseVer = null;
  function poll() {
    const s = document.createElement('script');
    s.src = 'version.js?_=' + Date.now();
    s.onload = () => {
      const v = window.__UIP_VER;
      if (v) {
        if (baseVer === null) baseVer = v;
        else if (v !== baseVer) { location.reload(); return; }
      }
      s.remove();
      setTimeout(poll, INTERVAL);
    };
    s.onerror = () => { s.remove(); setTimeout(poll, INTERVAL); };
    document.head.appendChild(s);
  }
  poll();
})();

// ════════════════════════════════════════════
// PLATFORM (mo/web 통합 사용현황용)
// ════════════════════════════════════════════
// 서버·로컬 모두 폴더명(/mo/ 또는 /web/)으로 판별. 둘 다 아니면(예: 루트) mo로 취급.
const PLATFORM = location.pathname.includes('/web/') ? 'web' : 'mo';
let dashTab = 'all'; // '사용 현황' 패널에서 선택된 탭: 'all' | 'mo' | 'web'

// ════════════════════════════════════════════
// ANALYTICS (localStorage 기반)
// ════════════════════════════════════════════
// AK는 mo/web 양쪽 페이지에서 동일한 키를 쓴다 — 같은 도메인(서버)에서 열람하면
// localStorage가 오리진 단위로 공유되므로, 두 사이트의 활동 기록이 자동으로 합쳐진다.
// (file://로 각각 열면 브라우저별로 오리진이 분리돼 합쳐지지 않을 수 있음)
const AK = 'uip_analytics_v1';
function aGet() { try { return JSON.parse(localStorage.getItem(AK) || '{}'); } catch { return {}; } }
function aSave(d) { try { localStorage.setItem(AK, JSON.stringify(d)); } catch {} }

// 기존 오타 검색어 일괄 삭제 (1회 실행 후 플래그 설정)
(function clearOldSearches() {
  if (localStorage.getItem('uip_searches_cleared')) return;
  const d = aGet(); d.searches = []; aSave(d);
  localStorage.setItem('uip_searches_cleared', '1');
})();

function aTrack(event, payload) {
  const d = aGet();
  const today = new Date().toISOString().slice(0, 10);
  d.daily = d.daily || {};
  d.services = d.services || {};
  d.categories = d.categories || {};
  d.downloads = d.downloads || 0;
  d.searches = d.searches || [];
  // 플랫폼별 분리 집계 — '사용 현황'의 모바일/웹사이트 탭에서 사용.
  // (기존 flat 필드는 '전체' 탭용으로 계속 함께 채워 하위호환 유지)
  d.byPlatform = d.byPlatform || {};
  const p = d.byPlatform[PLATFORM] = d.byPlatform[PLATFORM] || { daily: {}, services: {}, categories: {}, downloads: 0, searches: [] };
  if (event === 'view_service') {
    d.daily[today] = (d.daily[today] || 0) + 1;
    p.daily[today] = (p.daily[today] || 0) + 1;
    if (payload?.svc) {
      d.services[payload.svc] = (d.services[payload.svc] || 0) + 1;
      p.services[payload.svc] = (p.services[payload.svc] || 0) + 1;
    }
  }
  if (event === 'filter_cat' && payload?.cat) {
    d.categories[payload.cat] = (d.categories[payload.cat] || 0) + 1;
    p.categories[payload.cat] = (p.categories[payload.cat] || 0) + 1;
  }
  if (event === 'download') {
    d.downloads += (payload?.count || 1);
    p.downloads += (payload?.count || 1);
  }
  if (event === 'search' && payload?.q?.length >= 2) {
    d.searches = [payload.q, ...d.searches.filter(s => s !== payload.q)].slice(0, 30);
    p.searches = [payload.q, ...p.searches.filter(s => s !== payload.q)].slice(0, 30);
  }
  aSave(d);
}

async function openDashboard() {
  dashTab = 'all';
  await renderDashboard();
  document.getElementById('dashboard').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDashboard() {
  document.getElementById('dashboard').classList.remove('open');
  document.body.style.overflow = '';
}
function setDashTab(tab) {
  if (dashTab === tab) return;
  dashTab = tab;
  renderDashboard();
}

// ── 사이드바 토글 (모바일) ─────────────────────────────────────────────
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const isOpen = sb.classList.contains('open');
  if (isOpen) { closeSidebar(); } else {
    sb.classList.add('open');
    ov.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
  document.body.style.overflow = '';
}
function closeSidebarOnMobile() {
  if (window.innerWidth <= 768) closeSidebar();
}

async function renderDashboard() {
  // ── 통합 대시보드: 상대편 사이트 stats.js를 <script> 주입으로 로드 ──────────
  // (fetch는 file://로 로컬에서 열었을 때 다른 폴더 파일을 못 읽으므로 script 주입 방식 사용 — version.js 자동새로고침과 동일 패턴)
  const otherPlatform = PLATFORM === 'mo' ? 'web' : 'mo';
  const otherStatsUrl = PLATFORM === 'mo' ? '../web/stats.js' : '../mo/stats.js';
  let otherStats = null;
  try {
    otherStats = await new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = otherStatsUrl + '?_=' + Date.now();
      s.onload = () => { const v = window.__STATS__; s.remove(); resolve(v || null); };
      s.onerror = () => { s.remove(); resolve(null); };
      document.head.appendChild(s);
    });
  } catch(_) {}

  const myScreens  = DISPLAY_DATA.length;
  const myServices = new Set(DISPLAY_DATA.map(i => extractService(i.name))).size;
  const myCats     = new Set(DISPLAY_DATA.map(i => i.category)).size;
  const myInfo     = { screens: myScreens, services: myServices, categories: myCats, ok: true };
  const otherInfo  = otherStats
    ? { screens: otherStats.totalScreens, services: otherStats.totalServices, categories: otherStats.totalCategories, ok: true }
    : { screens: 0, services: 0, categories: 0, ok: false };

  // 카탈로그 규모(스크린·서비스·카테고리 수)는 플랫폼마다 따로 집계한 값을 그대로 보여준다.
  // (같은 서비스가 모바일·웹 양쪽에 있을 수 있어 서비스 수를 단순 합산하면 중복 집계되므로,
  //  총 스크린 수만 두 사이트를 더하고 서비스·카테고리는 플랫폼별로 나란히 표기)
  const platformStats = {
    mo:  PLATFORM === 'mo'  ? myInfo : otherInfo,
    web: PLATFORM === 'web' ? myInfo : otherInfo,
  };
  const allScreens = platformStats.mo.screens + platformStats.web.screens;

  const data = aGet();
  const body = document.getElementById('dash-body');

  // ── 탭에 따라 활동 데이터 소스 결정 ──────────────────────────────
  // '전체' = 지금까지 누적된 통합 집계(과거 데이터 포함, mo/web 공유 localStorage 기반)
  // '모바일'/'웹사이트' = 이 갱신 이후 플랫폼별로 태깅되어 쌓인 활동만
  let actData, tabLabel, hasPlatformActivity = true;
  if (dashTab === 'mo' || dashTab === 'web') {
    const p = (data.byPlatform || {})[dashTab];
    hasPlatformActivity = !!p;
    actData = p || { daily: {}, services: {}, categories: {}, downloads: 0, searches: [] };
    tabLabel = dashTab === 'mo' ? '모바일' : '웹사이트';
  } else {
    actData = { daily: data.daily || {}, services: data.services || {}, categories: data.categories || {}, downloads: data.downloads || 0, searches: data.searches || [] };
    tabLabel = '전체';
  }

  // 최근 7일
  const weekDays = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    weekDays.push({ key, label: `${d.getMonth()+1}.${d.getDate()}`, count: (actData.daily || {})[key] || 0 });
  }
  const weekTotal = weekDays.reduce((s, d) => s + d.count, 0);
  const weekMax = Math.max(...weekDays.map(d => d.count), 1);

  // 인기 카테고리 — 선택된 탭의 활동 데이터에서 상위 6개 (플랫폼 고유 카테고리명도 그대로 반영)
  const catEntries = Object.entries(actData.categories || {})
    .sort((a, b) => b[1] - a[1])
    .slice(0, 6)
    .map(([name, cnt]) => ({ name, cnt }));
  const catMax = Math.max(...catEntries.map(c => c.cnt), 1);
  const hasCatData = catEntries.length > 0;

  // 인기 서비스
  const svcEntries = Object.entries(actData.services || {}).sort((a, b) => b[1] - a[1]).slice(0, 8);
  // '모바일'/'웹사이트' 탭은 지금 보고 있는 사이트가 아닌 쪽의 서비스일 수 있으므로,
  // 아이콘은 그 서비스가 실제로 속한 사이트의 icons/ 폴더에서 가져와야 한다.
  const rankIconBase = iconBase((dashTab === 'mo' || dashTab === 'web') ? dashTab : PLATFORM);

  const searches = actData.searches || [];

  // 비용 절감 계산 (7명, 타사 서비스 기준) — 선택된 탭 기준으로 계산
  const TEAM = 7;
  const UIBOWL_GROUP = 11900;
  const monthlySave  = UIBOWL_GROUP * TEAM;   // 83,300
  const annualSave   = monthlySave * 12;      // 999,600

  const activeDays    = Object.keys(actData.daily || {}).filter(k => (actData.daily[k] || 0) > 0).length;
  const allViews      = Object.values(actData.daily || {}).reduce((s, v) => s + v, 0);
  const allDownloads  = actData.downloads || 0;
  const allSvcViews   = Object.values(actData.services || {}).reduce((s, v) => s + v, 0);
  const dailyRate     = monthlySave / 30;                     // ~2,777원/일
  const accSavings    = Math.round(
    activeDays * dailyRate +   // 매일 구독료 절감
    allDownloads * 400 +        // 다운로드 1건당 400원 가치
    allSvcViews  * 200          // 서비스 열람 1회당 200원 가치
  );

  const tabBtn = (key, label) => `<button class="dash-tab ${dashTab === key ? 'active' : ''}" onclick="setDashTab('${key}')">${label}</button>`;
  const pill = (key, label) => {
    const info = platformStats[key];
    return `
      <button type="button" class="dash-platform-pill ${dashTab === key ? 'active' : ''}" onclick="setDashTab('${key}')">
        <span class="dash-platform-pill-label">${label}</span>
        <span class="dash-platform-pill-val">${info.ok ? info.screens.toLocaleString() + '장' : '정보 없음'}</span>
        <span class="dash-platform-pill-sub">${info.ok ? info.services + '개 서비스 · ' + info.categories + '개 카테고리' : '불러오지 못했어요'}</span>
      </button>`;
  };

  body.innerHTML = `
    <div class="dash-tabs">
      ${tabBtn('all', '전체')}
      ${tabBtn('mo', '모바일')}
      ${tabBtn('web', '웹사이트')}
    </div>

    <div class="dash-hero">
      <div class="dash-hero-big">총 <em>${allScreens.toLocaleString()}</em>장의 스크린이 있어요</div>
      <div class="dash-platform-pills">
        ${pill('mo', '모바일')}
        ${pill('web', '웹사이트')}
      </div>
    </div>

    ${!hasPlatformActivity ? `
    <div class="dash-section">
      <p class="dash-empty-msg">이 브라우저에서는 아직 ${tabLabel} 사이트 활동 기록이 없어요.<br>${tabLabel} 사이트를 둘러보면 여기에 열람·검색·다운로드 데이터가 쌓여요.</p>
    </div>
    ` : `
    <!-- 비용 절감 섹션 -->
    <div class="dash-cost-card">
      <div class="dash-cost-headline">${tabLabel} 기준 <em>${accSavings.toLocaleString()}원</em>을 절감했어요</div>
      <div class="dash-cost-sub">${activeDays}일 활용 · ${allViews}번 열람 · 다운로드 ${allDownloads}개</div>

      <div class="dash-cost-2col">
        <div class="dash-cost-stat">
          <div class="dash-cost-stat-label">지금까지 절감</div>
          <div class="dash-cost-stat-val">${accSavings.toLocaleString()}<span class="dash-cost-stat-unit">원</span></div>
        </div>
        <div class="dash-cost-stat">
          <div class="dash-cost-stat-label">1년 뒤 예상 절감</div>
          <div class="dash-cost-stat-val accent">${annualSave.toLocaleString()}<span class="dash-cost-stat-unit">원</span></div>
        </div>
      </div>
    </div>

    <div class="dash-cards">
      <div class="dash-card">
        <div class="dash-card-label">이번 주 열람</div>
        <div class="dash-card-num">${weekTotal.toLocaleString()}<span class="dash-card-unit">번</span></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">누적 다운로드</div>
        <div class="dash-card-num">${allDownloads.toLocaleString()}<span class="dash-card-unit">개</span></div>
      </div>
      <div class="dash-card">
        <div class="dash-card-label">최근 검색</div>
        <div class="dash-card-num">${searches.length}<span class="dash-card-unit">개</span></div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-week-card">
        <div class="dash-week-headline">이번 주 <span style="color:var(--accent)">${weekTotal}번</span> 열람했어요</div>
        <div class="dash-week-sub">일별 열람 현황 · ${tabLabel}</div>
        <div class="dash-bars">
          ${weekDays.map((d, i) => {
            const h = Math.max((d.count / weekMax) * 100, 2);
            const isToday = i === 6;
            return `<div class="dash-bar-col">
              <div class="dash-bar-val">${d.count > 0 ? d.count : ''}</div>
              <div class="dash-bar-rect ${isToday ? 'active' : 'past'}" style="height:${h}%"></div>
              <span class="dash-bar-date">${d.label}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="dash-grid-2">
      <div class="dash-hbar-card">
        <div class="dash-section-title">인기 카테고리</div>
        ${hasCatData ? `
          <div class="dash-hbar-list">
            ${catEntries.map(c => `
              <div>
                <div class="dash-hbar-top">
                  <span class="dash-hbar-name">${c.name}</span>
                  <span class="dash-hbar-cnt">${c.cnt}회</span>
                </div>
                <div class="dash-hbar-track">
                  <div class="dash-hbar-fill" style="width:${Math.round((c.cnt/catMax)*100)}%"></div>
                </div>
              </div>`).join('')}
          </div>
        ` : `<p class="dash-empty-msg">아직 데이터가 없어요<br>카테고리를 선택하면 집계돼요</p>`}
      </div>

      <div class="dash-rank-card">
        <div class="dash-section-title">인기 서비스</div>
        ${svcEntries.length ? `
          <div class="dash-rank-list">
            ${svcEntries.map(([svc, cnt], i) => `
              <div class="dash-rank-row">
                <span class="dash-rank-num">${i+1}</span>
                <img class="dash-rank-icon" src="${rankIconBase}${encodeURIComponent(svc)}.png" data-icon-base="${rankIconBase}" alt="${svc}" onerror="tryNextIconExt(this)">
                <span class="dash-rank-name">${svc}</span>
                <span class="dash-rank-cnt">${cnt}회</span>
              </div>`).join('')}
          </div>
        ` : `<p class="dash-empty-msg">아직 데이터가 없어요<br>서비스를 클릭하면 집계돼요</p>`}
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-section-title">최근 검색어</div>
      ${searches.length ? `
        <div class="dash-tags">${searches.slice(0,20).map(q=>`<span class="dash-tag">${q}</span>`).join('')}</div>
      ` : `<p class="dash-empty-msg">아직 검색 기록이 없어요</p>`}
    </div>
    `}
  `;
}

// __UIP_CHECK_START__  업로드 후 엑박 점검: index.html?check=20261021 (날짜) | ?check=서비스명 | ?check=all
(function(){
  var q = new URLSearchParams(location.search).get('check');
  if (q === null) return;
  window.addEventListener('load', async function(){
    q = q.trim().normalize('NFC');
    var test = /^\d{8}$/.test(q) ? function(n){ return n.endsWith('_' + q); }
             : (q === '' || q === 'all') ? function(){ return true; }
             : function(n){ return n.normalize('NFC').startsWith(q + '_'); };
    var items = DATA.filter(function(x){ return x.category !== 'icons' && test(x.name); });
    var box = document.createElement('div'); box.id = 'uip-check';
    box.style.cssText = 'position:fixed;inset:auto 16px 16px auto;z-index:99999;width:min(460px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;color:#111;border:2px solid #111;border-radius:12px;padding:16px;font:13px/1.5 sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25)';
    document.body.appendChild(box);
    var bad = [], done = 0;
    box.textContent = '서버 점검 중… 0 / ' + items.length;
    for (var i = 0; i < items.length; i += 20) {
      await Promise.all(items.slice(i, i + 20).map(async function(x){
        var u = imgUrl(x.path) + '?check=' + Date.now();
        var ok = await new Promise(function(r){ var im = new Image(); im.onload = function(){ r(true); }; im.onerror = function(){ r(false); }; im.src = u; });
        if (!ok) bad.push(x.path);
        done++;
      }));
      box.textContent = '서버 점검 중… ' + done + ' / ' + items.length;
    }
    bad.sort();
    var byCat = {};
    bad.forEach(function(p){ var c = p.split('/')[0]; byCat[c] = (byCat[c] || 0) + 1; });
    box.innerHTML = '<b style="font-size:15px">' + (bad.length ? '❌ 엑박 ' + bad.length + '장' : '✅ 이상 없음') + '</b> (' + items.length + '장 점검, 조건: ' + (q || 'all') + ')' +
      (bad.length ? '<div style="margin:8px 0">' + Object.keys(byCat).map(function(c){ return c + ' ' + byCat[c]; }).join(' · ') + '</div>' +
        '<textarea readonly style="width:100%;height:160px;font:12px monospace">' + bad.join('\n') + '</textarea>' +
        '<div style="color:#666">→ 서버에 파일이 없는 것. (업로드) zip을 다시 올리세요.</div>' : '') +
      '<div style="text-align:right;margin-top:8px"><button onclick="document.getElementById(\'uip-check\').remove()">닫기</button></div>';
    console.log('[UIP check]', items.length, 'checked,', bad.length, 'missing', bad);
  });
})();
// __UIP_CHECK_END__
</script>
